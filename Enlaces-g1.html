<!DOCTYPE html>
<html lang="es" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>La teoría de las cosas chiquititas que se agarran fuerte</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#060a18;--pn:#0f1730;--tx:#e8eeff;--mu:#9fb0d8;--bd:#24305a;--ac:#7c3aed;--ac2:#22d3ee;--ch:#16204a}
:root[data-theme="dark"]{--bg:#060a18;--pn:#0f1730;--tx:#e8eeff;--mu:#9fb0d8;--bd:#24305a;--ch:#16204a}
html{scroll-padding-top:env(safe-area-inset-top,0px);background:#060a18}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.4 "Trebuchet MS",system-ui,sans-serif;padding:12px;min-height:100vh}
header{text-align:center;position:relative;padding:4px 70px}
h1{margin:0;font-size:clamp(20px,4.6vw,38px);line-height:1.1;background:linear-gradient(90deg,#ff4fa3,#f59e0b,#22d3ee,#8b5cf6);-webkit-background-clip:text;background-clip:text;color:transparent}
.ttl{display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:8px 16px}
.lvl{display:flex;gap:6px}
.lvl button{border:2px solid var(--bd);background:var(--pn);border-radius:12px;padding:6px 12px;font-weight:700;transition:border-color .2s}
.lvl button:hover{border-color:#7c3aed}
.lvl button.on{background:linear-gradient(90deg,#7c3aed,#0891b2);color:#fff;border-color:transparent;box-shadow:0 0 12px #7c3aed55}
.sub{margin:4px 0 0;color:var(--mu);letter-spacing:.12em;text-transform:uppercase;font-size:13px;font-weight:700}
.stars{position:absolute;right:0;top:0;background:var(--pn);border:2px solid #f59e0b;border-radius:20px;padding:4px 10px;font-weight:800;box-shadow:0 0 12px #f59e0b33}
#tabs{display:flex;gap:6px;margin:12px 0;overflow-x:auto;padding-bottom:4px}
button{font:inherit;cursor:pointer;color:var(--tx)}
#tabs button{flex:1 0 auto;border:2px solid var(--bd);background:var(--pn);border-radius:12px;padding:8px 12px;font-weight:700;transition:border-color .2s,transform .1s}
#tabs button:hover{border-color:#7c3aed}
#tabs button.on{background:linear-gradient(90deg,#7c3aed,#0891b2);color:#fff;border-color:transparent;box-shadow:0 0 16px #7c3aed55}
.main{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(280px,1fr);gap:14px}
@media(max-width:820px){.main{grid-template-columns:1fr}}
.stage{position:relative}
canvas{width:100%;display:block;border-radius:16px;border:2px solid var(--bd);background:#060a18;box-shadow:0 0 30px #7c3aed44;touch-action:none}
.shake{animation:sh .15s infinite}@keyframes sh{50%{transform:translate(2px,-2px)}}
#moli{display:flex;gap:12px;align-items:center;margin-top:10px;background:var(--pn);border:2px solid var(--bd);border-radius:16px;padding:8px 12px;min-height:112px;box-shadow:0 4px 20px #00000044}
#say{margin:0;font-weight:600;flex:1;min-width:0}
@media(max-width:520px){#moli{min-height:150px}}
.axo{flex:0 0 112px;height:88px;border-radius:14px;background:#0a1020;border:2px solid #22d3ee;box-shadow:0 0 14px #22d3ee66;display:flex;align-items:center;justify-content:center;animation:bob 2.4s ease-in-out infinite}
.axo svg{display:block;width:104px;height:auto;overflow:visible;filter:drop-shadow(0 0 4px #22D3EE) drop-shadow(0 0 10px rgba(34,211,238,.45))}
.axo .ln,.axo .gl{fill:none;stroke:#22D3EE;stroke-linecap:round;stroke-linejoin:round;stroke-width:3.6}
.axo .gl{stroke:#FF4DB8;stroke-width:3.4}
.axo .pl{fill:url(#axF);stroke:url(#axG);stroke-width:3;stroke-linejoin:round}
.axo .pv{fill:none;stroke:url(#axG);stroke-width:1.6;stroke-linecap:round;opacity:.65}
.axo .fl{fill:rgba(34,211,238,.13);stroke:none}
.axo .bl{fill:rgba(255,77,184,.2)}
.axo .eye{fill:#22D3EE}
.axo .wk{opacity:0;animation:wk 9s linear infinite}
.axo .eR{animation:eyeR 9s linear infinite}
.axo .pkHead{transform-origin:150px 200px;animation:tilt 4.5s ease-in-out infinite alternate}
.axo .gL{transform-origin:98px 108px;animation:gill 1.8s ease-in-out infinite alternate}
.axo .gR{transform-origin:202px 108px;animation:gillR 1.8s ease-in-out infinite alternate}
@keyframes bob{50%{transform:translateY(-3px)}}
@keyframes tilt{from{transform:rotate(-2.5deg)}to{transform:rotate(2.5deg)}}
@keyframes gill{from{transform:rotate(-5deg)}to{transform:rotate(6deg)}}
@keyframes gillR{from{transform:rotate(5deg)}to{transform:rotate(-6deg)}}
@keyframes eyeR{0%,52%{opacity:1}52.2%,60%{opacity:0}60.2%,100%{opacity:1}}
@keyframes wk{0%,52%{opacity:0}52.2%,60%{opacity:1}60.2%,100%{opacity:0}}
@media (prefers-reduced-motion:reduce){.axo,.axo *{animation:none!important}.axo .wk{opacity:0}}
#post{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:8px;margin-top:10px;align-items:stretch}
#post div{background:var(--ch);border:2px solid transparent;border-radius:12px;padding:6px 8px;font-size:13px;line-height:1.3;color:var(--mu);transition:background-color .3s,border-color .3s,color .3s;contain:layout paint}
#post div.lit{border-color:#f59e0b;color:var(--tx);background:#f59e0b33}
.pn{display:flex;flex-direction:column;background:var(--pn);border:2px solid var(--bd);border-radius:16px;padding:12px;align-self:start;box-shadow:0 4px 20px #00000044}
.pn>*{order:5}
label{display:block;margin:8px 0;font-weight:700;font-size:14px}label b{float:right;color:var(--ac2)}
input[type=range]{width:100%;accent-color:#7c3aed;height:28px;cursor:pointer}input:disabled{opacity:.35;cursor:not-allowed}label.lk{background:var(--ch);border-radius:10px;padding:4px 8px}label.lk b{color:var(--mu)}#P{accent-color:#ec4899}#V{accent-color:#22d3ee}#T{accent-color:#f59e0b}
.bt{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0}
.bt button,.opt,.go,.seg button{border:2px solid var(--bd);background:var(--ch);border-radius:10px;padding:7px 10px;font-weight:700;transition:border-color .2s,background .2s}
.bt button.on{background:linear-gradient(90deg,#7c3aed,#0891b2);color:#fff;border-color:#22d3ee;box-shadow:0 0 12px #22d3ee44}
.go{background:linear-gradient(90deg,#f59e0b,#ef4444);color:#fff;border:0;margin:4px 0}
.opt{display:block;width:100%;margin:5px 0;text-align:left}.opt:hover,.bt button:hover{border-color:#7c3aed;background:#1e2b5e}
.seg{display:flex;gap:4px;margin-bottom:6px}.seg button{flex:1;padding:6px 4px;font-size:13px}.seg button.on{background:#7c3aed;color:#fff;border-color:#9333ea}
.mt{background:var(--ch);border-radius:12px;padding:8px 10px;margin:8px 0;font-size:14px;border:1px solid var(--bd)}
.mt div{margin:3px 0}.mt{background:linear-gradient(135deg,#241b3d,#17233e)}.bar{height:10px;background:#0a1026;border-radius:6px;overflow:hidden;border:1px solid var(--bd)}.bar i{display:block;height:100%;background:linear-gradient(90deg,#22d3ee,#f59e0b,#ef4444);transition:width .3s}
.mu{color:var(--mu);font-size:14px}
table{width:100%;border-collapse:collapse;font-size:12px;margin:6px 0}th,td{border:1px solid var(--bd);padding:4px;text-align:center}th{background:var(--ch)}
footer{margin-top:14px;text-align:center;color:var(--mu);font-size:13px}
.fx{position:fixed;pointer-events:none;font-size:26px;animation:fx 1.4s ease-out forwards;z-index:9}
@keyframes fx{to{transform:translate(var(--x),var(--y)) rotate(360deg);opacity:0}}

.seg{flex-wrap:wrap}.seg button{flex:1 1 auto}
.opt,.go,.seg button,#tabs button,.bt button{min-height:44px}
:focus-visible{outline:3px solid #22d3ee;outline-offset:2px}
.opt:disabled{opacity:.55;cursor:default}
#say{min-height:2.8em}
#mis{display:flex;flex-direction:column}
#mis>*{order:10}
#mis>.qpred{order:20;margin-top:12px;padding-top:10px;border-top:1px dashed var(--bd)}
#mis>.qexp{order:30}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

.pinI{display:none;position:absolute;top:6px;right:6px;left:auto;width:40px;height:40px;padding:0;align-items:center;justify-content:center;border:0;border-radius:50%;background:rgba(6,10,24,.55);cursor:pointer;z-index:2;-webkit-tap-highlight-color:transparent}
.pinI svg{width:30px;height:30px;overflow:visible;transform-origin:16px 29px;transition:transform .25s ease,opacity .25s ease,filter .25s ease;filter:drop-shadow(0 1px 2px #000a)}
.pinI .psh{fill:rgba(0,0,0,.55);transition:opacity .2s}
.pinI[aria-pressed=false] svg{transform:rotate(42deg) translate(1px,-2px);opacity:.6;filter:grayscale(.65) drop-shadow(0 1px 2px #000a)}
.pinI[aria-pressed=false] .psh{opacity:0}
.pinI:focus-visible{outline:3px solid #22d3ee;outline-offset:2px}
/* ===== Prácticas en pestañas ===== */
#sel{gap:6px;margin-bottom:4px}
#sel button{position:relative;white-space:nowrap;-webkit-touch-callout:none;-webkit-user-select:none;user-select:none}
#sel button .bdg{display:inline-block;margin-left:5px;font-size:11px;font-weight:800;opacity:.85}
#sel button .bdg:empty{display:none}
#sel button .chev{display:none}
#ptitle{font-weight:800;font-size:19px;line-height:1.25;color:var(--ac2);text-decoration:underline;text-decoration-thickness:2px;text-underline-offset:5px;margin:8px 0 .5cm;padding-top:10px;border-top:1px solid var(--bd)}
#tip{position:fixed;z-index:60;max-width:240px;padding:6px 10px;border-radius:10px;background:#0a1020;border:1px solid #22d3ee;color:var(--tx);font-size:13px;font-weight:600;line-height:1.3;pointer-events:none;box-shadow:0 4px 18px #000a}
#tip[hidden]{display:none}
@media(max-width:820px){
  .main{display:flex;flex-direction:column;gap:0}
  .main>div,.pn,#mis{display:contents}
  .stage{order:1;margin-bottom:10px}
  .stage.pin{position:sticky;top:0;z-index:20;padding-bottom:8px;background:var(--bg)}
  #sel{order:2;margin:0 0 10px}
  #sel button .chev{display:inline;margin-left:4px}
  .main:not(.popen) #sel button.on .chev::before{content:'▸'}
  .main.popen #sel button.on .chev::before{content:'▾'}
  .pinI{display:inline-flex}
  #ptitle{order:3;margin:0;padding:12px 12px .5cm;background:var(--pn);border:2px solid var(--bd);border-bottom:0;border-radius:16px 16px 0 0}
  #bt{order:4;margin:0;padding:4px 12px;background:var(--pn);border:2px solid var(--bd);border-top:0;border-bottom:0;border-radius:0}
  .bt:empty{display:none}
  #mis>:not(.qpred):not(.qexp){order:5;background:var(--pn);border:2px solid var(--bd);border-top:0;border-radius:0 0 16px 16px;padding:4px 12px 12px;margin-bottom:10px}
  #moli{order:6}
  #post{order:7}
  #mis>.qpred,#mis>.qexp{background:var(--pn);border:2px solid var(--bd);border-radius:16px;padding:12px;margin:10px 0 0}
  #mis>.qpred{order:8}
  #mis>.qexp{order:9}
  #note{order:10;margin:12px 0 0}
  .main:not(.popen) #ptitle,.main:not(.popen) #bt,.main:not(.popen) #mis>:not(.qpred):not(.qexp){display:none}
}
@media(max-width:820px) and (max-height:560px){.stage.pin{position:static}}

/* ===== Color por práctica y tonos para subopciones ===== */
.pn{--h:265}
#sel button:not(.pinbtn){border-color:hsl(var(--h) 60% 45%);background:hsl(var(--h) 50% 20%)}
#sel button:not(.pinbtn):hover{border-color:hsl(var(--h) 85% 65%);background:hsl(var(--h) 50% 27%)}
#sel button.on:not(.pinbtn){background:linear-gradient(135deg,hsl(var(--h) 75% 46%),hsl(var(--h) 70% 34%));color:#fff;border-color:hsl(var(--h) 90% 72%);box-shadow:0 0 14px hsl(var(--h) 80% 55%/.45)}
#ptitle{color:hsl(var(--h) 85% 72%);text-decoration-color:hsl(var(--h) 75% 55%);border-top-color:hsl(var(--h) 50% 35%)}
#bt button,#mis .bt button,#mis .seg button{--l:30%;--s:50%;background:hsl(var(--h) var(--s) var(--l));border-color:hsl(var(--h) 60% calc(var(--l) + 14%));color:#fff}
#bt button:nth-child(4n+1),#mis .bt button:nth-child(4n+1),#mis .seg button:nth-child(4n+1){--l:24%}
#bt button:nth-child(4n+2),#mis .bt button:nth-child(4n+2),#mis .seg button:nth-child(4n+2){--l:33%;--s:55%}
#bt button:nth-child(4n+3),#mis .bt button:nth-child(4n+3),#mis .seg button:nth-child(4n+3){--l:42%;--s:60%}
#bt button:nth-child(4n),#mis .bt button:nth-child(4n),#mis .seg button:nth-child(4n){--l:51%;--s:65%}
#bt button:hover,#mis .bt button:hover,#mis .seg button:hover{background:hsl(var(--h) calc(var(--s) + 10%) calc(var(--l) + 8%));border-color:hsl(var(--h) 90% 75%)}
#bt button.on,#mis .bt button.on,#mis .seg button.on{background:hsl(var(--h) calc(var(--s) + 15%) calc(var(--l) + 6%));border-color:#fff;box-shadow:0 0 0 2px hsl(var(--h) 85% 70%),0 0 14px hsl(var(--h) 80% 55%/.55)}

/* ===== Premio final: Andy gigante ===== */
#andy{position:fixed;inset:0;z-index:1000;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:clamp(6px,1.6vh,16px);padding:calc(env(safe-area-inset-top,0px) + 52px) 12px calc(env(safe-area-inset-bottom,0px) + 12px);background:radial-gradient(ellipse at 50% 38%,#10204a 0%,#060a18 72%);overflow:hidden}
#andy[hidden]{display:none}
.axo.big{margin:0;flex:none;height:auto;border:0;border-radius:0;background:none;box-shadow:none;animation:none}
.axo.big svg{width:min(96vw,calc((100vh - 252px)*1.415));width:min(96vw,calc((100dvh - 252px)*1.415));min-width:200px;height:auto;filter:drop-shadow(0 0 10px #22D3EE) drop-shadow(0 0 34px rgba(34,211,238,.5));transition:opacity 1.6s}
.axo.big .pl{fill:url(#abF);stroke:url(#abG)}
.axo.big .pv{stroke:url(#abG)}
.axo.big.talk svg{animation:atalk .42s ease-in-out infinite alternate}
@keyframes atalk{to{transform:scale(1.022)}}
.axo.big.glitch{animation:agl .35s steps(2,end) 5}
@keyframes agl{0%{transform:translate(0,0);filter:hue-rotate(0)}25%{transform:translate(-8px,3px) skewX(4deg);filter:hue-rotate(70deg) saturate(2)}50%{transform:translate(7px,-3px);opacity:.55}75%{transform:translate(-4px,2px) skewX(-5deg);filter:hue-rotate(-60deg)}100%{transform:translate(0,0);opacity:1}}
.axo.big.off svg{opacity:.28;filter:grayscale(1) drop-shadow(0 0 6px #5b6b99)}
#amsg{margin:0;max-width:min(94vw,1200px);min-height:2.5em;text-align:center;font-weight:800;font-size:clamp(20px,4.4vw,42px);line-height:1.15;color:var(--tx);text-shadow:0 0 14px #22d3ee88,0 2px 0 #060a18;text-wrap:balance}
#andy.typing #amsg::after{content:'\258D';color:#ff4db8;margin-left:2px}
#cake{display:none;margin:0;flex:none}
#cake.show{display:block}
#cake svg{width:min(96vw,calc((100vh - 252px)*1.415));width:min(96vw,calc((100dvh - 252px)*1.415));min-width:200px;height:auto;filter:drop-shadow(0 0 16px rgba(245,158,11,.4));animation:cpop .9s cubic-bezier(.2,1.4,.4,1) both}
#cake .ckl{animation:cfade .8s ease .7s both}
@keyframes cpop{0%{transform:scale(.2) rotate(-6deg);opacity:0}100%{transform:scale(1) rotate(0);opacity:1}}
@keyframes cfade{from{opacity:0}to{opacity:1}}
.axo.big.gone{display:none}
@media(prefers-reduced-motion:reduce){#cake svg,#cake .ckl{animation:none}}
#afoot{min-height:46px;display:flex;align-items:center;justify-content:center}
@media(max-width:700px){#amsg{min-height:3.6em}.axo.big svg{width:min(96vw,calc((100vh - 232px)*1.415));width:min(96vw,calc((100dvh - 232px)*1.415))}}
.abtn{border:2px solid #f59e0b;background:var(--pn);color:var(--tx);border-radius:14px;padding:8px 14px;font:inherit;font-weight:800;cursor:pointer}
.abtn:hover{background:#f59e0b33}
.abtn:focus-visible{outline:3px solid #22d3ee;outline-offset:2px}
#aclose{position:absolute;top:calc(env(safe-area-inset-top,0px) + 10px);right:12px}
.asr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
@media(hover:none){.kh{display:none}}
</style>
</head>
<body>
<header>
  <div class="ttl"><h1>La teoría de las cosas chiquititas que se agarran fuerte</h1><div class="lvl" role="group" aria-label="Nivel académico"><button type="button" id="lvEso">ESO</button><button type="button" id="lvBach" class="on">Bachillerato</button></div></div>
  <p class="sub">Enlaces químicos y fuerzas intermoleculares</p>
  <div class="stars" aria-live="polite">⭐ <span id="st">0</span>/<span id="stmax">0</span></div>
</header>
<nav id="tabs" aria-label="Tipos de enlace"></nav>
<div class="main">
  <div>
    <div class="stage"><canvas id="cv" role="img" aria-label="Escena de la simulación"></canvas><button type="button" id="pinI" class="pinI" aria-pressed="true" aria-label="Fijar el escenario arriba al desplazar la página" title="Escenario fijo (pulsa para soltarlo)"><svg viewBox="0 0 32 32" aria-hidden="true"><ellipse class="psh" cx="16" cy="29.4" rx="5" ry="1.7"/><g class="pg"><line x1="16" y1="17" x2="16" y2="29" stroke="#cbd5e1" stroke-width="2" stroke-linecap="round"/><path d="M10.5 6.5L21.5 6.5L19 15.2L13 15.2Z" fill="#ff4fa3" stroke="#ffd0e6" stroke-width="1.2" stroke-linejoin="round"/><ellipse cx="16" cy="6" rx="8.4" ry="3.1" fill="#ff7ab8" stroke="#ffd0e6" stroke-width="1.2"/><rect x="11" y="15" width="10" height="2.6" rx="1.2" fill="#f59e0b" stroke="#ffe3a3" stroke-width="1"/><path d="M13 8.6L14.2 14" stroke="#fff" stroke-opacity=".6" stroke-width="1.4" stroke-linecap="round"/></g></svg></button></div>
    <div id="moli">

            <linearGradient id="axG" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="58" y2="0">
              <stop offset="0" stop-color="#22D3EE"/><stop offset=".25" stop-color="#22D3EE"/><stop offset="1" stop-color="#FF4DB8"/>

            <linearGradient id="axF" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="58" y2="0">
              <stop offset="0" stop-color="#22D3EE" stop-opacity=".2"/><stop offset=".25" stop-color="#22D3EE" stop-opacity=".2"/><stop offset="1" stop-color="#FF4DB8" stop-opacity=".24"/>
            </linearGradient>
          </defs>
          <g class="pkHead">
            <g class="gL">
              <g transform="translate(98 107) rotate(-135.7) scale(0.96)"><path class="pl" d="M0 0C10 -9 26 -13 42 -12C52 -11 58 -8 58 -3L54 0L58 3C58 8 52 11 42 12C26 13 10 9 0 0Z"/><path class="pv" d="M6 0L48 0M14 -3L44 -8M14 3L44 8"/></g>
              <g transform="translate(82 123) rotate(-166) scale(0.85)"><path class="pl" d="M0 0C10 -9 26 -13 42 -12C52 -11 58 -8 58 -3L54 0L58 3C58 8 52 11 42 12C26 13 10 9 0 0Z"/><path class="pv" d="M6 0L48 0M14 -3L44 -8M14 3L44 8"/></g>
              <g transform="translate(76 134) rotate(160.7) scale(0.73)"><path class="pl" d="M0 0C10 -9 26 -13 42 -12C52 -11 58 -8 58 -3L54 0L58 3C58 8 52 11 42 12C26 13 10 9 0 0Z"/><path class="pv" d="M6 0L48 0M14 -3L44 -8M14 3L44 8"/></g>
            </g>
            <g class="gR">
              <g transform="translate(202 107) rotate(-44.3) scale(0.96)"><path class="pl" d="M0 0C10 -9 26 -13 42 -12C52 -11 58 -8 58 -3L54 0L58 3C58 8 52 11 42 12C26 13 10 9 0 0Z"/><path class="pv" d="M6 0L48 0M14 -3L44 -8M14 3L44 8"/></g>
              <g transform="translate(218 123) rotate(-14) scale(0.85)"><path class="pl" d="M0 0C10 -9 26 -13 42 -12C52 -11 58 -8 58 -3L54 0L58 3C58 8 52 11 42 12C26 13 10 9 0 0Z"/><path class="pv" d="M6 0L48 0M14 -3L44 -8M14 3L44 8"/></g>
              <g transform="translate(224 134) rotate(19.3) scale(0.73)"><path class="pl" d="M0 0C10 -9 26 -13 42 -12C52 -11 58 -8 58 -3L54 0L58 3C58 8 52 11 42 12C26 13 10 9 0 0Z"/><path class="pv" d="M6 0L48 0M14 -3L44 -8M14 3L44 8"/></g>
            </g>
            <path class="fl" d="M70 168A80 80 0 0 1 230 168C230 196 200 210 150 210C100 210 70 196 70 168Z"/>

/* ===== Inclinación del móvil (sensor): dirección del "suelo" en pantalla ===== */
const ENL_TILT = { x: 0, y: 1, tx: 0, ty: 1, on: false, asked: false };
function enlTiltFromOrientation(e) {
  if (e.beta == null || e.gamma == null) return;
  const b = e.beta * Math.PI / 180, g = e.gamma * Math.PI / 180;
  const dx = Math.sin(g) * Math.cos(b), dy = Math.sin(b);
  const ang = ((screen.orientation && screen.orientation.angle) || window.orientation || 0) * Math.PI / 180,
        c = Math.cos(ang), s = Math.sin(ang);
  let sx = dx * c + dy * s, sy = -dx * s + dy * c;
  const m = Math.hypot(sx, sy), k = Math.max(0, 1 - m / 0.35);   // móvil casi plano: se mezcla con "abajo"
  sx = sx * (1 - k); sy = sy * (1 - k) + k;
  const n = Math.hypot(sx, sy) || 1;
  ENL_TILT.tx = sx / n; ENL_TILT.ty = sy / n; ENL_TILT.on = true;
}
function enlEnableTilt() {
  if (ENL_TILT.asked) return;
  ENL_TILT.asked = true;
  window.addEventListener('deviceorientation', enlTiltFromOrientation, true);
}
(function () {
  if (typeof window.DeviceOrientationEvent === 'undefined') return;
  if (typeof DeviceOrientationEvent.requestPermission === 'function') {   // iOS: permiso tras un toque
    const ask = () => {
      document.removeEventListener('pointerup', ask, true);
      DeviceOrientationEvent.requestPermission().then(r => { if (r === 'granted') enlEnableTilt(); }).catch(() => {});
    };
    document.addEventListener('pointerup', ask, true);
  } else enlEnableTilt();
})();

      ions.push({
        id: r * COLS + c, c, r, s, hx: cx0 + c * SP, hy: cy0 + r * SP, x: cx0 + c * SP, y: cy0 + r * SP,
        vx: 0, vy: 0, free: false, hp: 1, cap: 6, ph: rnd() * 6.283
      });
    }
    const crysX0 = cx0 - 24, crysX1 = cx0 + (COLS - 1) * SP + 24, crysY0 = cy0 - 24;
    // Agua repartida de forma uniforme por todo el vaso (rejilla hexagonal con pequeño desorden), sin huecos y fuera del cristal
    const genPts = k => {
      const out = [], dx0 = 28.6 * k, dy0 = 24.8 * k;
      for (let r = 0, y = WY0 + 14; y < BY1 - 12; r++, y += dy0) for (let x = BX0 + 14 + (r % 2 ? dx0 / 2 : 0); x < BX1 - 12; x += dx0) {
        const px = x + (rnd() - 0.5) * 6, py = y + (rnd() - 0.5) * 6;
        if (!(px > crysX0 && px < crysX1 && py > crysY0)) out.push({ x: px, y: py });
      }
      return out;
    };
    let pts = genPts(1.5);
    for (let k = 1.5; k >= 0.8; k -= 0.02) { const g = genPts(k); if (g.length > N_WATERS) break; pts = g; }
    while (pts.length < N_WATERS) {
      let bestP = null, bestD = -1;
      for (let k = 0; k < 25; k++) {
        const px = BX0 + 18 + rnd() * (BX1 - BX0 - 36), py = WY0 + 16 + rnd() * (BY1 - WY0 - 32);
        if (px > crysX0 && px < crysX1 && py > crysY0) continue;
        const dmin = Math.min(...pts.map(q => Math.hypot(q.x - px, q.y - py)));
        if (dmin > bestD) { bestD = dmin; bestP = { x: px, y: py }; }
      }
      if (!bestP) break;
      pts.push(bestP);
    }
    for (const q of pts) waters.push({ x: q.x, y: q.y, vx: 0, vy: 0, nx: 0, ny: 0, ang: rnd() * 6.283, shellOf: null });
  }

  function activeNeighbors(ion) {
    let n = ion.r === ROWS - 1 ? 1 : 0;
    for (const o of ions) if (o !== ion && !o.free && Math.abs(o.c - ion.c) + Math.abs(o.r - ion.r) === 1) n++;
    return n;
  }

  function inspectIon(ion) {
    selectedIon = ion;
    say(ion.s > 0 ? 'El oxígeno, con carga parcial negativa, se orienta hacia el Na⁺.' : 'Los hidrógenos, con carga parcial positiva, se orientan hacia el Cl⁻.', 1);
    flash(0);
    updateStatusUI();
  }

  function recordRunIfReady(pct) {
    if (runDone || pct < 50) return;
    runDone = true;
    const tRun = +elapsed.toFixed(1);
    const sameTemp = runs.find(r => Math.abs(r.temp - tempC) < 5);
    if (sameTemp) sameTemp.time = tRun;
    else runs.push({ temp: tempC, time: tRun });

    const gotDis = star('ionic-4-dissolve');
    let gotTemp = false;
    if (runs.length >= 2) {
      const temps = runs.map(r => r.temp);
      if (Math.max(...temps) - Math.min(...temps) >= 15) gotTemp = star('ionic-4-temp');
    }
    flash(2);
    if (gotDis || gotTemp) sayPool(WIN, 1);
    else if (!done['ionic-4-temp']) say('¡La mitad de los iones ya está separada e hidratada! Reinicia el vaso y prueba otra temperatura (≥ 15 °C de diferencia) para comparar la rapidez.', 1);
    else say('Más temperatura acelera la disolución, pero rapidez y solubilidad no son lo mismo.', 1);

    if (!explained) { explained = true; showExplain(); }
  }

  function showExplain() {
    ask({
      into: vw, ph: 'Explica:',
      q: 'Si aumentamos la temperatura y la sal se disuelve antes, ¿qué estamos cambiando directamente en este modelo?',
      o: [
        'La rapidez de disolución (cinética), que no es lo mismo que la solubilidad de equilibrio',
        'La solubilidad máxima de equilibrio, porque rapidez y solubilidad son idénticas',
        'La carga eléctrica de los iones Na⁺ y Cl⁻'
      ],
      ok: 0, key: null,
      good: '¡Exacto! Subir la temperatura acelera la cinética de separación, pero la solubilidad de equilibrio es una magnitud distinta.',
      bad: 'Recuerda: la rapidez con la que se disuelve no equivale a cuánto admite el agua en equilibrio.'
    });
  }

  function updateStatusUI() {
    const freeCount = ions.filter(i => i.free).length, pct = Math.round(freeCount / ions.length * 100);
    const st = $('#disStat');
    if (st) {
      const bestLine = runs.length ? runs.map(r => `${r.temp} °C → ${r.time.toFixed(1)} s`).join(' · ') : 'Aún sin completar el 50 %';
      st.innerHTML = `<div>🧂 Iones separados del cristal: <b>${freeCount}/${ions.length} (${pct} %)</b> · ⏱️ <b>${elapsed.toFixed(1)} s</b></div>`
        + `<div class="bar"><i style="width:${pct}%"></i></div>`
        + `<div class="mu">Registro cinético (≥ 50 %): ${bestLine}</div>`
        + `<div class="mu">Nota: aquí se mide <b>rapidez de disolución</b>, no solubilidad de equilibrio (en el NaCl la solubilidad varía muy poco con T).</div>`;
    }
    const inf = $('#ionInfo');
    if (inf) {
      if (!selectedIon) inf.textContent = '👆 Toca cualquier ion Na⁺ o Cl⁻ en el vaso para inspeccionar su capa de hidratación.';
      else if (selectedIon.s > 0) {
        const sh = waters.filter(w => w.shellOf === selectedIon).length;
        inf.innerHTML = `<b>Ion Na⁺ (catión +):</b> atrae al átomo de <b>O (δ−)</b> del agua. ${selectedIon.free ? `Rodeado en 2D por <b>${sh}</b> aguas (esfera completa en este modelo: 6 aguas para el Na⁺; en 3D es dinámica, ≈ 5–6).` : 'Aún forma parte de la red cristalina.'}`;
      } else {
        const sh = waters.filter(w => w.shellOf === selectedIon).length;
        inf.innerHTML = `<b>Ion Cl⁻ (anión −):</b> atrae a los átomos de <b>H (δ+)</b> del agua. ${selectedIon.free ? `Rodeado en 2D por <b>${sh}</b> aguas (esfera completa en este modelo: 6 aguas para el Cl⁻; en 3D es dinámica, ≈ 6–7).` : 'Aún forma parte de la red cristalina.'}`;
      }
    }
  }

  function buildControls() {
    vw.innerHTML = '<p><b>Prueba:</b> observa cómo el agua hidrata y separa los iones. Luego reinicia el vaso y compara dos temperaturas distintas.</p>'
      + `<label>Temperatura del agua <b id="vt4">${tempC} °C</b><input type="range" id="T4" min="10" max="80" step="5" value="${tempC}" aria-label="Temperatura del agua"></label>`
      + '<div class="bt"><button id="pBtn">⏸ Pausar</button><button class="go" id="rBtn">↺ Reiniciar vaso</button><button id="iBtn">🔍 Inspeccionar ion</button></div>'
      + `<label class="lk"><input type="checkbox" id="vp" ${showPoles ? 'checked' : ''}> Ver polos (δ− en O, δ+ en H)</label>`
      + '<div class="mt" id="disStat"></div><p class="mu" id="ionInfo"></p>';

    $('#T4').oninput = e => { tempC = +e.target.value; $('#vt4').textContent = `${tempC} °C`; flash(2); };
    const P = $('#pBtn');
    P.onclick = () => { paused = !paused; P.textContent = paused ? '▶ Reanudar' : '⏸ Pausar'; P.classList.toggle('on', paused); };
    $('#rBtn').onclick = () => { paused = false; P.textContent = '⏸ Pausar'; P.classList.remove('on'); initBeaker(); updateStatusUI(); say('Vaso reiniciado. Prueba ahora otra temperatura para comparar la rapidez.', 1); };
    $('#iBtn').onclick = () => inspectIon(ions[selectedIon ? (ions.indexOf(selectedIon) + 1) % ions.length : 0]);
    $('#vp').onchange = e => { showPoles = e.target.checked; };
    vw.append(hintBtn([
      'Las moléculas de agua golpean primero las esquinas del cristal y rodean cada ion que se desprende.',
      'Espera a que se separe y se hidrate la mitad de los iones (al menos 8 de 16) para ganar la estrella de disolución.',
      'Pulsa «Reiniciar vaso», cambia la temperatura al menos 15 °C (por ejemplo de 25 °C a 65 °C) y vuelve a alcanzar la mitad de los iones (50 %).'
    ]).el);
    updateStatusUI();
    if (explained) showExplain();
  }

  function update(dt) {
    if (!predicted || paused) return;
    elapsed += dt;
    const hotK = tempC > 60 ? (tempC - 60) / 20 : 0, tFactor = 0.7 + 0.5 * ((tempC - 10) / 70) + 1.1 * Math.pow(hotK, 1.6), kinRate = 0.145 * Math.pow(1.033, tempC - 20) * (1 + 1.5 * hotK), maxV = 58 * tFactor;   // movilidad progresiva, que se dispara por encima de 60 °C
    for (const ion of ions) {
      if (ion.free) continue;
      const nb = activeNeighbors(ion);
      let nearW = 0;
      for (const w of waters) if (!w.shellOf && Math.hypot(w.x - ion.x, w.y - ion.y) < 40) nearW++;   // solo cuentan aguas libres cercanas: el ion se separa cuando ya tiene agua a mano
      if (nearW >= 2) ion.hp -= kinRate * Math.max(0.35, (4.4 - nb) * 0.45) * Math.min(3, nearW) * 0.55 * dt;
      const vib = RM ? 0 : 0.7 * tFactor;
      ion.x = ion.hx + vib * Math.sin(elapsed * 14 + ion.ph);
      ion.y = ion.hy + vib * Math.cos(elapsed * 12 + ion.ph * 1.3);
      if (ion.hp <= 0) {
        ion.free = true; ion.vy = -14 - rnd() * 12; ion.vx = (ion.c - 1.5) * 9 + (rnd() - 0.5) * 10;
        if (!shellSaid) { shellSaid = true; say('El agua rodea a los iones: forma sus capas de hidratación.', 1); flash(1); }
      }
    }
    recordRunIfReady(Math.round(ions.filter(i => i.free).length / ions.length * 100));

    const shellN = new Map();
    for (const w of waters) if (w.shellOf) { if (!w.shellOf.free) w.shellOf = null; else shellN.set(w.shellOf, (shellN.get(w.shellOf) || 0) + 1); }
    // Bienvenida: cualquier agua libre que se acerque a un ion separado con hueco (Na⁺ hasta 5, Cl⁻ hasta 6) se une a su esfera
    for (const w of waters) {
      if (w.shellOf) continue;
      let best = null, bd = 52;
      for (const ion of ions) {
        if (!ion.free || (shellN.get(ion) || 0) >= ion.cap) continue;
        const d = Math.hypot(w.x - ion.x, w.y - ion.y);
        if (d < bd) { bd = d; best = ion; }
      }
      if (best) { w.shellOf = best; shellN.set(best, (shellN.get(best) || 0) + 1); }
    }
    // Ningún ion separado se queda sin agua: si tiene menos de 3, recluta la agua libre más próxima (nunca se la quita a otro ion)
    for (const ion of ions) {
      if (!ion.free) continue;
      while ((shellN.get(ion) || 0) < 3) {
        let best = null, bd = 1e9;
        for (const w of waters) { if (w.shellOf) continue; const d = Math.hypot(w.x - ion.x, w.y - ion.y); if (d < bd) { bd = d; best = w; } }
        if (!best) break;
        best.shellOf = ion; shellN.set(ion, (shellN.get(ion) || 0) + 1);
      }
    }

    // Con el móvil inclinado: los iones disueltos solo se deslizan por el contorno interior del vaso (pared izquierda, fondo, pared derecha)
    const tiltMode = ENL_TILT.on;
    if (tiltMode) {
      const kT = 1 - Math.exp(-6 * dt);
      ENL_TILT.x += (ENL_TILT.tx - ENL_TILT.x) * kT; ENL_TILT.y += (ENL_TILT.ty - ENL_TILT.y) * kT;
      const PX0 = BX0 + 42, PX1 = BX1 - 42, PY0 = WY0 + 42, PY1 = BY1 - 42, LH = PY1 - PY0, LW = PX1 - PX0, LT = 2 * LH + LW;
      const clampN = (v, lo, hi) => Math.min(hi, Math.max(lo, v));
      const pathPt = u => u < LH ? { x: PX0, y: PY0 + u, tx: 0, ty: 1 } : u < LH + LW ? { x: PX0 + (u - LH), y: PY1, tx: 1, ty: 0 } : { x: PX1, y: PY1 - (u - LH - LW), tx: 0, ty: -1 };
      const project = (x, y) => {
        const c = [LH * 0 + clampN(y - PY0, 0, LH), LH + clampN(x - PX0, 0, LW), LH + LW + clampN(PY1 - y, 0, LH)];
        let best = c[0], bd = 1e9;
        for (const u of c) { const q = pathPt(u), d = Math.hypot(q.x - x, q.y - y); if (d < bd) { bd = d; best = u; } }
        return best;
      };
      // El cristal que aún queda en el fondo es un obstáculo: los iones no lo atraviesan
      let cMin = 1e9, cMax = -1e9;
      for (const o of ions) if (!o.free && Math.abs(o.y - PY1) < 32) { cMin = Math.min(cMin, o.x); cMax = Math.max(cMax, o.x); }
      const hasB = cMax > -1e9, bL = hasB ? LH + (cMin - 38 - PX0) : 0, bR = hasB ? LH + (cMax + 38 - PX0) : 0;
      const keepSide = o => {
        if (!hasB) return;
        if (o.side === undefined || o.side === 0) o.side = o.ps < (bL + bR) / 2 ? -1 : 1;
        if (o.side < 0 && o.ps > bL) { o.ps = bL; o.pv = 0; }
        if (o.side > 0 && o.ps < bR) { o.ps = bR; o.pv = 0; }
      };
      const fr = ions.filter(o => o.free);
      for (const ion of fr) {
        if (ion.ps === undefined) { ion.ps = project(ion.x, ion.y); ion.pv = 0; ion.side = 0; }
        const q = pathPt(clampN(ion.ps, 0, LT));
        const acc = 300 * (ENL_TILT.x * q.tx + ENL_TILT.y * q.ty) + (rnd() - 0.5) * 14;
        ion.pv = (ion.pv + acc * dt) * Math.pow(0.12, dt);
        ion.ps = clampN(ion.ps + ion.pv * dt, 0, LT);
        if (ion.ps <= 0 || ion.ps >= LT) ion.pv = 0;
        if (!hasB) ion.side = 0;
        keepSide(ion);
      }
      // Los iones se reparten a lo largo del contorno sin solaparse
      const gap = Math.max(32, Math.min(62, 560 / (fr.length + 1)));
      for (let pass = 0; pass < 6; pass++) {
        fr.sort((p, q) => p.ps - q.ps);
        for (let i = 0; i + 1 < fr.length; i++) {
          const a2 = fr[i], b2 = fr[i + 1], d = b2.ps - a2.ps;
          if (d < gap) { const sh = (gap - d) / 2; a2.ps -= sh; b2.ps += sh; }
        }
        for (const o of fr) { o.ps = clampN(o.ps, 0, LT); keepSide(o); }
      }
      for (const ion of fr) {
        const q = pathPt(ion.ps), kk = Math.min(1, 9 * dt);
        ion.x += (q.x - ion.x) * kk; ion.y += (q.y - ion.y) * kk; ion.vx = 0; ion.vy = 0;
      }
    }

    // Iones libres: movimiento suave y se reparten por el vaso (repulsión suave entre ellos)
    for (const ion of ions) {
      if (!ion.free || tiltMode) continue;
      let ax = (rnd() - 0.5) * 26 * tFactor, ay = (rnd() - 0.5) * 26 * tFactor;
      // Las esferas formadas se alejan muy suavemente del cristal hasta dejar ≈ 1 cm de espacio libre (borde de la esfera → borde del cristal)
      let nc = null, dcm = 1e9;
      for (const o of ions) { if (o.free) continue; const d = Math.hypot(ion.x - o.x, ion.y - o.y); if (d < dcm) { dcm = d; nc = o; } }
      if (nc && dcm > 0.01) {
        const D = (ion.s > 0 ? 27 : 29) + 9 + (nc.s > 0 ? 11.5 : 14.5) + GAP_CM;
        if (dcm < D) { const f = Math.min(22, (D - dcm) * 0.5); ax += (ion.x - nc.x) / dcm * f; ay += (ion.y - nc.y) / dcm * f; }
      }
      for (const o of ions) {
        if (o === ion || !o.free) continue;
        const dx = ion.x - o.x, dy = ion.y - o.y, d = Math.hypot(dx, dy) || 1;
        if (d < 92) { const f = (1 - d / 92) * 45; ax += dx / d * f; ay += dy / d * f; }
      }
      ion.vx = (ion.vx + ax * dt) * Math.pow(0.25, dt);
      ion.vy = (ion.vy + ay * dt) * Math.pow(0.25, dt);
      ion.x += ion.vx * dt; ion.y += ion.vy * dt;
      const pad = 42;
      if (ion.x < BX0 + pad) { ion.x = BX0 + pad; ion.vx = Math.abs(ion.vx) * 0.5; }
      if (ion.x > BX1 - pad) { ion.x = BX1 - pad; ion.vx = -Math.abs(ion.vx) * 0.5; }
      if (ion.y < WY0 + pad) { ion.y = WY0 + pad; ion.vy = Math.abs(ion.vy) * 0.5; }
      if (ion.y > BY1 - pad) { ion.y = BY1 - pad; ion.vy = -Math.abs(ion.vy) * 0.5; }
    }
    for (let i = 0; i < ions.length; i++) for (let j = i + 1; j < ions.length; j++) {
      const a = ions[i], b = ions[j];
      if (!a.free && !b.free) continue;
      const dx = b.x - a.x, dy = b.y - a.y, d = Math.hypot(dx, dy) || 1, minD = a.free && b.free ? (tiltMode ? 0 : 62) : 36;
      if (d < minD) {
        const push = (minD - d) * 0.5;
        if (a.free) { a.x -= dx / d * push; a.y -= dy / d * push; }
        if (b.free) { b.x += dx / d * push; b.y += dy / d * push; }
      }
    }

    const shellGroups = new Map();
    for (const w of waters) if (w.shellOf) { if (!shellGroups.has(w.shellOf)) shellGroups.set(w.shellOf, []); shellGroups.get(w.shellOf).push(w); }

    // Cada esfera: las aguas se ordenan por su ángulo actual y se reparten a partes iguales; al llegar una nueva entra en su hueco natural y las demás se corren para hacerle sitio
    const slotA = new Map();
    for (const [ion, grp] of shellGroups) {
      const n = grp.length;
      const items = grp.map(w => ({ w, a: (Math.atan2(w.y - ion.y, w.x - ion.x) + 6.283185) % 6.283185 })).sort((p, q) => p.a - q.a);
      let sx = 0, sy = 0;
      items.forEach((it, i) => { const d = it.a - i * 6.283185 / n; sx += Math.cos(d); sy += Math.sin(d); });
      const phi = Math.atan2(sy, sx) + (RM ? 0 : 0.06);
      items.forEach((it, i) => slotA.set(it.w, phi + i * 6.283185 / n));
    }
    const maxW = 30 * tFactor;
    for (const w of waters) {
      if (w.shellOf) {
        const ion = w.shellOf;
        const targetA = slotA.get(w), rShell = ion.s > 0 ? 27 : 29;
        const sx = ion.x + Math.cos(targetA) * rShell - w.x, sy = ion.y + Math.sin(targetA) * rShell - w.y;
        const sd = Math.hypot(sx, sy) || 1, stp = Math.min(sd * Math.min(1, 7 * dt), (sd > 50 ? 70 : 170) * dt);
        w.x += sx / sd * stp; w.y += sy / sd * stp;
        w.vx = 0; w.vy = 0;
        const desiredAng = ion.s > 0 ? Math.atan2(w.y - ion.y, w.x - ion.x) : Math.atan2(ion.y - w.y, ion.x - w.x);
        w.ang = lerpAng(w.ang, desiredAng, Math.min(1, 10 * dt));
        continue;
      }
      // Agua libre: deriva browniana suave + repulsión suave con sus vecinas (así el agua se reparte y no quedan huecos)
      // + atracción hacia un ion solo cuando está muy cerca (ahí sí acelera)
      w.nx = (w.nx || 0) + (-(w.nx || 0) * 0.9 * dt) + (rnd() - 0.5) * 120 * Math.sqrt(dt);
      w.ny = (w.ny || 0) + (-(w.ny || 0) * 0.9 * dt) + (rnd() - 0.5) * 120 * Math.sqrt(dt);
      let ax = RM ? 0 : w.nx * tFactor, ay = RM ? 0 : w.ny * tFactor;
      for (const o of waters) {
        if (o === w) continue;
        const dx = w.x - o.x, dy = w.y - o.y, d2 = dx * dx + dy * dy;
        if (d2 < 1024 && d2 > 0.01) { const d = Math.sqrt(d2), f = (1 - d / 32) * 85; ax += dx / d * f; ay += dy / d * f; }
      }
      for (const ion of ions) {
        const dx = ion.x - w.x, dy = ion.y - w.y, d = Math.hypot(dx, dy) || 1;
        const open = !ion.free || (shellN.get(ion) || 0) < ion.cap, rng = ion.free ? 95 : 56;
        if (d < rng && open) { const f = (1 - d / rng) * (ion.free ? 170 : 130); ax += dx / d * f; ay += dy / d * f; }
        const keep = ion.free && !open ? 42 : 26;
        if (d < keep) { const f = (keep - d) * 10; ax -= dx / d * f; ay -= dy / d * f; }
      }
      w.vx = (w.vx + ax * dt) * Math.pow(0.5, dt);
      w.vy = (w.vy + ay * dt) * Math.pow(0.5, dt);
      const v = Math.hypot(w.vx, w.vy);
      if (v > maxW) { w.vx *= maxW / v; w.vy *= maxW / v; }
      w.x += w.vx * dt; w.y += w.vy * dt;
      if (w.x < BX0 + 13) { w.x = BX0 + 13; w.vx = Math.abs(w.vx) * 0.5; }
      if (w.x > BX1 - 13) { w.x = BX1 - 13; w.vx = -Math.abs(w.vx) * 0.5; }
      if (w.y < WY0 + 11) { w.y = WY0 + 11; w.vy = Math.abs(w.vy) * 0.5; }
      if (w.y > BY1 - 11) { w.y = BY1 - 11; w.vy = -Math.abs(w.vy) * 0.5; }

      let nearIon = null, bestD = 54;
      for (const ion of ions) { const d = Math.hypot(w.x - ion.x, w.y - ion.y); if (d < bestD) { bestD = d; nearIon = ion; } }
      if (nearIon) {
        const desired = nearIon.s > 0 ? Math.atan2(w.y - nearIon.y, w.x - nearIon.x) : Math.atan2(nearIon.y - w.y, nearIon.x - w.x);
        w.ang = lerpAng(w.ang, desired, Math.min(1, 5 * dt));
      } else w.ang += (rnd() - 0.5) * 1.4 * dt;
    }

    for (let i = 0; i < waters.length; i++) {
      const a = waters[i];
      for (let j = i + 1; j < waters.length; j++) {
        const b = waters[j];
        if (a.shellOf && b.shellOf && a.shellOf === b.shellOf) continue;
        const dx = b.x - a.x, dy = b.y - a.y, d2 = dx * dx + dy * dy;
        if (d2 < 324 && d2 > 0.01) {
          const d = Math.sqrt(d2), o = (18 - d) * 0.4, ux = dx / d, uy = dy / d;
          if (!a.shellOf) { a.x -= ux * o; a.y -= uy * o; }
          if (!b.shellOf) { b.x += ux * o; b.y += uy * o; }
        }
      }
      if (!a.shellOf) for (const ion of ions) {
        const dx = a.x - ion.x, dy = a.y - ion.y, d2 = dx * dx + dy * dy, minD = ion.free ? ((shellN.get(ion) || 0) >= ion.cap ? 40 : 24) : 21;
        if (d2 < minD * minD && d2 > 0.01) { const d = Math.sqrt(d2), o = minD - d; a.x += dx / d * o; a.y += dy / d * o; }
      }
    }
    updateStatusUI();
  }


  function drawWater(w, scale = 1, poles = showPoles) {
    const ox = w.x - Math.cos(w.ang) * 2.5 * scale, oy = w.y - Math.sin(w.ang) * 2.5 * scale, bl = 8.8 * scale;
    const a1 = w.ang - HALF_ANG, a2 = w.ang + HALF_ANG;
    const h1x = ox + Math.cos(a1) * bl, h1y = oy + Math.sin(a1) * bl, h2x = ox + Math.cos(a2) * bl, h2y = oy + Math.sin(a2) * bl;
    cx.strokeStyle = '#cbd5e1'; cx.lineWidth = 2 * scale;
    cx.beginPath(); cx.moveTo(ox, oy); cx.lineTo(h1x, h1y); cx.moveTo(ox, oy); cx.lineTo(h2x, h2y); cx.stroke();
    cx.fillStyle = '#ef4444'; cx.beginPath(); cx.arc(ox, oy, 5.2 * scale, 0, 6.283); cx.fill();
    cx.fillStyle = '#e0f2fe'; cx.beginPath(); cx.arc(h1x, h1y, 3.3 * scale, 0, 6.283); cx.arc(h2x, h2y, 3.3 * scale, 0, 6.283); cx.fill();
    if (poles) {
      cx.font = `bold ${Math.round(8.5 * scale)}px ${FN}`; cx.textAlign = 'center';
      cx.fillStyle = '#fde047'; cx.fillText('δ−', ox - Math.cos(w.ang) * 7 * scale, oy - Math.sin(w.ang) * 7 * scale + 3);
      cx.fillStyle = '#7dd3fc'; cx.fillText('δ+', (h1x + h2x) / 2 + Math.cos(w.ang) * 6 * scale, (h1y + h2y) / 2 + Math.sin(w.ang) * 6 * scale + 3);
    }
  }

  function draw() {

    const wg = cx.createLinearGradient(0, WY0, 0, BY1);
    wg.addColorStop(0, 'rgba(34, 211, 238, 0.14)'); wg.addColorStop(1, 'rgba(14, 116, 144, 0.26)');

    if (showPoles) {
      cx.save(); cx.setLineDash([3, 3]); cx.strokeStyle = 'rgba(253, 224, 71, 0.45)'; cx.lineWidth = 1.3;
      cx.beginPath(); for (const w of waters) if (w.shellOf) { cx.moveTo(w.x, w.y); cx.lineTo(w.shellOf.x, w.shellOf.y); }
      cx.stroke(); cx.restore();

    for (const a of ions) if (!a.free) for (const b of ions) if (!b.free && a.id < b.id && Math.abs(a.c - b.c) + Math.abs(a.r - b.r) === 1) { cx.moveTo(a.x, a.y); cx.lineTo(b.x, b.y); }
    cx.stroke();

    for (const ion of ions) {

      cx.save();
      if (selectedIon === ion) { cx.strokeStyle = '#fde047'; cx.lineWidth = 3; cx.beginPath(); cx.arc(ion.x, ion.y, r + 5, 0, 6.283); cx.stroke(); }
      const g = cx.createRadialGradient(ion.x - r * .3, ion.y - r * .3, r * .1, ion.x, ion.y, r);
      g.addColorStop(0, '#ffffffcc'); g.addColorStop(.4, col); g.addColorStop(1, col + 'aa');
      cx.fillStyle = g; cx.beginPath(); cx.arc(ion.x, ion.y, r, 0, 6.283); cx.fill(); cx.restore();
      cx.fillStyle = '#060a18'; cx.font = `bold 11px ${FN}`; cx.textAlign = 'center';
      cx.fillText(ion.s > 0 ? 'Na⁺' : 'Cl⁻', ion.x, ion.y + 4);
    }

    cx.strokeStyle = '#7dd3fc'; cx.lineWidth = 4; cx.lineJoin = 'round';
    cx.beginPath(); cx.moveTo(BX0 - 6, BY0); cx.lineTo(BX0, BY0 + 8); cx.lineTo(BX0, BY1); cx.lineTo(BX1, BY1); cx.lineTo(BX1, BY0 + 8); cx.lineTo(BX1 + 6, BY0); cx.stroke();

    cx.fillStyle = '#9fb0d8'; cx.font = `11px ${FN}`;

};

/* ===== Iónico 5: conductividad iónica (sólido, fundido, disuelto y azúcar) ===== */
SC['ionic-5'] = sd => {
  const FN = '"Trebuchet MS",system-ui,sans-serif', CAT = '#a78bfa', ANI = '#34d399';
  const MODES = [
    { id: 'solid', n: 'NaCl sólido', cond: false, desc: 'Iones Na⁺ y Cl⁻ fijos en la red: no pueden desplazarse hacia los electrodos.' },
    { id: 'molten', n: 'NaCl fundido', cond: true, desc: 'Al fundirse se rompe la red: los iones Na⁺ y Cl⁻ se mueven libremente.' },
    { id: 'aq', n: 'NaCl disuelto', cond: true, desc: 'Iones Na⁺ y Cl⁻ hidratados y móviles en agua: conducen la corriente.' },
    { id: 'sugar', n: 'Azúcar disuelta', cond: false, desc: 'Moléculas neutras de sacarosa disueltas: hay movilidad, pero no hay iones libres.' }
  ];
  let predicted = true, mode = 'solid', batOn = false, pol = 1, explained = false;
  const tested = new Set(), parts = [], vw = document.createElement('div');
  const mObj = () => MODES.find(m => m.id === mode);
  const conducts = () => batOn && mObj().cond;

  function initParts() {
    parts.length = 0;
    if (mode === 'solid') {
      for (let r = 0; r < 4; r++) for (let c = 0; c < 6; c++) {
        parts.push({ s: (r + c) % 2 === 0 ? 1 : -1, bx: 245 + c * 42, by: 205 + r * 36, x: 245 + c * 42, y: 205 + r * 36, ph: rnd() * 6.283 });
      }
    } else if (mode === 'sugar') {
      for (let i = 0; i < 16; i++) {
        parts.push({ s: 0, x: 225 + rnd() * 250, y: 185 + rnd() * 165, vx: (rnd() - 0.5) * 36, vy: (rnd() - 0.5) * 36, ang: rnd() * 6.283 });
      }
    } else {
      for (let i = 0; i < 20; i++) {
        parts.push({ s: i % 2 === 0 ? 1 : -1, x: 225 + rnd() * 250, y: 185 + rnd() * 165, vx: (rnd() - 0.5) * 32, vy: (rnd() - 0.5) * 32 });
      }
    }
  }

  function checkProgress() {
    if (!batOn) return;
    tested.add(mode);
    if (tested.has('solid') && tested.has('molten') && tested.has('aq')) {
      if (star('ionic-5-modes')) sayPool(WIN, 1);
    }
    if (tested.has('sugar')) {
      if (star('ionic-5-sugar')) sayPool(WIN, 1);
    }
    if (!explained && tested.has('solid') && (tested.has('molten') || tested.has('aq')) && tested.has('sugar')) {
      explained = true;
      ask({
        into: vw, ph: 'Explica:', q: '¿Qué dos condiciones son necesarias para que un medio conduzca la corriente eléctrica mediante iones?',
        o: ['Tener átomos pesados y estar a alta presión', 'Tener partículas con carga eléctrica y que puedan moverse libremente', 'Ser transparente y contener moléculas de agua'],
        ok: 1, key: null,
        good: '¡Exacto! Hacen falta cargas móviles: en el sólido están fijas y en el azúcar disuelta las moléculas son neutras.',
        bad: 'Compara el NaCl sólido (cargas fijas) con el azúcar disuelta (moléculas móviles sin carga neta).'
      });
    }
  }

  function buildControls() {
    vw.innerHTML = '<p><b>Prueba:</b> selecciona cada muestra, cierra el interruptor y observa los portadores de carga y la bombilla.</p>'
      + `<div class="seg" id="mSel">${MODES.map(m => `<button data-m="${m.id}" class="${m.id === mode ? 'on' : ''}">${m.n}</button>`).join('')}</div>`
      + '<div class="bt"><button class="go" id="batBtn">🔌 Cerrar interruptor</button><button id="polBtn">⇄ Invertir polos (pila)</button></div>'
      + '<div class="mt" id="cStat"></div>';

    $('#mSel').onclick = e => {
      const b = e.target.closest('button'); if (!b) return;
      mode = b.dataset.m;
      $('#mSel').querySelectorAll('button').forEach(x => x.classList.toggle('on', x.dataset.m === mode));
      initParts();
      flash(mode === 'solid' ? 0 : mode === 'sugar' ? 3 : 1);
      say(mObj().desc, 1);
      checkProgress();
      syncUI();
    };
    const B = $('#batBtn');
    B.onclick = () => {
      batOn = !batOn;
      B.textContent = batOn ? '⏏ Abrir interruptor' : '🔌 Cerrar interruptor';
      B.classList.toggle('on', batOn);
      if (batOn) {
        flash(conducts() ? 2 : mode === 'solid' ? 0 : 3);
        say(conducts() ? '¡Bombilla encendida! Los cationes Na⁺ van al electrodo negativo y los aniones Cl⁻ al positivo.' : mObj().desc, 1);
        checkProgress();
      }
      syncUI();
    };
    $('#polBtn').onclick = () => { pol *= -1; say('Polaridad invertida: observa cómo cambia el sentido de migración de los iones.', 1); syncUI(); };
    vw.append(hintBtn([

      'Prueba también «Azúcar disuelta» con el interruptor cerrado para ganar todas las estrellas.'
    ]).el);
    syncUI();
  }

  function syncUI() {
    const st = $('#cStat');
    if (!st) return;
    const on = conducts();
    st.innerHTML = `<div>💡 Bombilla: <b>${on ? 'ENCENDIDA (conduce)' : 'APAGADA (no conduce)'}</b></div>`
      + `<div class="mu">${mObj().desc}</div>`
      + `<div class="mu">Muestras probadas con el interruptor cerrado: ${tested.size}/4</div>`;
  }

  function update(dt) {
    const t = performance.now() / 1000;
    if (mode === 'solid') {
      const a = RM ? 0 : 1.1;
      for (const p of parts) { p.x = p.bx + a * Math.sin(t * 9 + p.ph); p.y = p.by + a * Math.cos(t * 8 + p.ph * 1.4); }
      return;
    }
    const drift = batOn && mObj().cond ? 46 * pol : 0;
    for (const p of parts) {

      p.vy = (p.vy + (rnd() - 0.5) * 60 * dt) * Math.pow(0.35, dt);
      const vd = p.s > 0 ? -drift : p.s < 0 ? drift : 0;

      p.y += p.vy * dt;
      if (p.ang != null) p.ang += 0.6 * dt;
      if (p.x < 218) p.x = drift ? 480 : 218;
      if (p.x > 482) p.x = drift ? 220 : 482;
      if (p.y < 176) { p.y = 176; p.vy = Math.abs(p.vy); }
      if (p.y > 352) { p.y = 352; p.vy = -Math.abs(p.vy); }
    }

    cx.textAlign = 'center'; cx.fillStyle = on ? '#fde047' : '#9fb0d8'; cx.font = `bold 12px ${FN}`;
    cx.fillText(on ? '💡 CORRIENTE' : 'Sin corriente', 470, 100);

    if (mode === 'aq' || mode === 'sugar') {
      cx.fillStyle = 'rgba(34, 211, 238, 0.14)'; cx.fillRect(172, 162, 356, 204);
    } else if (mode === 'molten') {
      cx.fillStyle = 'rgba(249, 115, 22, 0.16)'; cx.fillRect(172, 162, 356, 204);
    }
    cx.strokeStyle = '#7dd3fc'; cx.lineWidth = 3;
    cx.beginPath(); cx.moveTo(170, 145); cx.lineTo(170, 368); cx.lineTo(530, 368); cx.lineTo(530, 145); cx.stroke();

      cx.fillText(pStr, ex, 174);
      cx.fillStyle = '#e8eeff'; cx.font = `11px ${FN}`;
      cx.fillText(isNeg ? 'Polo −' : 'Polo +', ex, 136);
    }

    for (const p of parts) {
      if (p.s === 0) {
        cx.save(); cx.translate(p.x, p.y); cx.rotate(p.ang);
        cx.fillStyle = '#f472b6'; cx.strokeStyle = '#fbcfe8'; cx.lineWidth = 1.5;
        cx.beginPath();

        cx.closePath(); cx.fill(); cx.stroke();

        cx.restore();
      } else {
        const r = p.s > 0 ? 11 : 14, col = p.s > 0 ? CAT : ANI;
        cx.fillStyle = col; cx.beginPath(); cx.arc(p.x, p.y, r, 0, 6.283); cx.fill();
        cx.fillStyle = '#060a18'; cx.font = `bold 11px ${FN}`; cx.textAlign = 'center';
        cx.fillText(p.s > 0 ? 'Na⁺' : 'Cl⁻', p.x, p.y + 4);

    cx.textAlign = 'left'; cx.fillStyle = '#e8eeff'; cx.font = `bold 14px ${FN}`;

  }

  return {

      ask({
        ph: 'Predice:', q: '¿Por qué un cristal de NaCl sólido no conduce la electricidad aunque esté formado por iones?',
        o: ['Porque sus iones ocupan posiciones fijas en la red y no pueden desplazarse', 'Porque en el sólido los iones pierden su carga', 'Porque los electrones salen volando del cristal'],
        ok: 0, key: 'ionic-5-predict',
        good: '¡Bien! Hay cargas, pero están fijas en la red; al fundir o disolver, quedan libres.',
        bad: 'Casi… 🤔 Piensa en si los iones pueden moverse hacia los electrodos en un sólido.',
        done: () => { }
      });
      $('#mis').append(vw);

      'Observa qué ocurre si acercas demasiado los átomos (r < rₑ): la repulsión dispara la energía.',
      'Selecciona los tres enlaces de carbono (C–C, C=C y C≡C) para comparar sus pozos.'
    ]).el);

  }

  function syncUI() {
    const b = bObj(), E = morse(distPm, b), st = $('#mStat');
    if ($('#vr')) $('#vr').textContent = `${distPm} pm`;
    if ($('#R')) $('#R').value = distPm;
    if (!st) return;
    const regime = Math.abs(distPm - b.re) <= 6 ? '✅ Distancia de equilibrio (enlace estable)'
      : distPm < b.re - 6 ? '⚠️ Repulsión fuerte entre núcleos y nubes'
      : '🧲 Atracción neta (acercándose al mínimo)';
    st.innerHTML = `<div><b>${b.n}</b> · rₑ = <b>${b.re} pm</b> · Dₑ = <b>${b.de} kJ·mol⁻¹</b></div>`
      + `<div>Energía potencial actual: <b>${Math.round(E)} kJ·mol⁻¹</b></div>`
      + `<div class="mu">${regime}</div>`;
  }

  function draw() {
    bg();
    const b = bObj(), half = (distPm - 40) * 1.15 / 2, xA = CC - half, xB = CC + half, y0 = 112;
    atomA.x = xA; atomA.y = y0; atomA.r = b.rA; atomB.x = xB; atomB.y = y0; atomB.r = b.rB;

    /* Orbitales: separados a distancia prudencial; al acercarse se solapan y se funden en un orbital molecular */
    const d = xB - xA, dEq = (b.re - 40) * 1.15 / 1, ry = b.rA * 1.5, rx = Math.max(dEq * 0.8, ry), dC = 2 * rx;
    const f = Math.max(0, Math.min(1, (dC - d) / (dC - dEq * 0.95))), fs = f * f * (3 - 2 * f), mx0 = (xA + xB) / 2;
    cx.save();
    if (fs < 1) {
      cx.globalAlpha = 1 - fs;
      for (const x of [xA, xB]) {
        const g = cx.createRadialGradient(x, y0, 2, x, y0, rx);
        g.addColorStop(0, b.col + '66'); g.addColorStop(1, b.col + '14');
        cx.fillStyle = g; cx.strokeStyle = b.col + '99'; cx.lineWidth = 1.2; cx.setLineDash([4, 3]);
        cx.beginPath(); cx.ellipse(x, y0, rx, ry, 0, 0, 6.283); cx.fill(); cx.stroke();
      }
    }
    if (fs > 0) {
      cx.globalAlpha = fs; cx.setLineDash([]);
      const mrx = d / 2 + ry * 0.95, g = cx.createRadialGradient(mx0, y0, 4, mx0, y0, mrx);
      g.addColorStop(0, b.col + '88'); g.addColorStop(1, b.col + '1c');
      cx.fillStyle = g; cx.strokeStyle = b.col; cx.lineWidth = 1.8;
      cx.beginPath(); cx.ellipse(mx0, y0, mrx, ry * (1 + 0.1 * fs), 0, 0, 6.283); cx.fill(); cx.stroke();
    }
    cx.restore();
    cx.fillStyle = '#9fb0d8'; cx.font = `11.5px ${FN}`; cx.textAlign = 'center';
    cx.fillText(fs < 0.05 ? 'Orbitales atómicos separados' : fs > 0.9 ? 'Orbital molecular enlazante' : 'Solapamiento: los orbitales se funden…', mx0, y0 - ry - 10);

    for (const [x, r, lbl] of [[xA, b.rA, b.lA], [xB, b.rB, b.lB]]) {
      cx.fillStyle = '#1e293b'; cx.strokeStyle = b.col; cx.lineWidth = 3;
      cx.beginPath(); cx.arc(x, y0, r, 0, 6.283); cx.fill(); cx.stroke();
      cx.fillStyle = '#e8eeff'; cx.font = `bold 18px ${FN}`; cx.textAlign = 'center'; cx.fillText(lbl, x, y0 + 6);
    }

    if (fs > 0.3) {
      const mx = (xA + xB) / 2;
      for (let k = 0; k < b.ord; k++) {
        const dy = (k - (b.ord - 1) / 2) * 12;
        cx.globalAlpha = fs; cx.fillStyle = '#fde047';
        cx.beginPath(); cx.arc(mx - 5, y0 + dy, 3.5, 0, 6.283); cx.arc(mx + 5, y0 + dy, 3.5, 0, 6.283); cx.fill(); cx.globalAlpha = 1;
      }
    }

    cx.strokeStyle = '#9fb0d8'; cx.lineWidth = 1.5;
    cx.beginPath(); cx.moveTo(xA, y0 + 46); cx.lineTo(xB, y0 + 46); cx.stroke();
    cx.fillStyle = '#e8eeff'; cx.font = `12px ${FN}`; cx.textAlign = 'center';
    cx.fillText(`r = ${distPm} pm`, (xA + xB) / 2, y0 + 62);

    const gx = 64, gy = 192, gw = 572, gh = 178, r0 = 45, r1 = 280, e0 = -920, e1 = 320;
    const X = r => gx + (r - r0) / (r1 - r0) * gw;
    const Y = e => gy + gh - (Math.min(e1, Math.max(e0, e)) - e0) / (e1 - e0) * gh;

    cx.fillStyle = 'rgba(6, 10, 24, 0.82)'; cx.fillRect(gx, gy, gw, gh);
    cx.strokeStyle = '#24305a'; cx.lineWidth = 1.5; cx.strokeRect(gx, gy, gw, gh);

    cx.setLineDash([4, 4]); cx.strokeStyle = '#64748b';
    cx.beginPath(); cx.moveTo(gx, Y(0)); cx.lineTo(gx + gw, Y(0)); cx.stroke();
    cx.setLineDash([]);

    for (const item of BONDS) {
      cx.strokeStyle = item.id === b.id ? item.col : item.col + '44';
      cx.lineWidth = item.id === b.id ? 3 : 1.5;
      cx.beginPath();
      for (let i = 0; i <= 90; i++) {
        const r = r0 + (r1 - r0) * i / 90, e = morse(r, item);
        i ? cx.lineTo(X(r), Y(e)) : cx.moveTo(X(r), Y(e));
      }
      cx.stroke();
    }

    cx.setLineDash([3, 3]); cx.strokeStyle = '#34d399';
    cx.beginPath(); cx.moveTo(X(b.re), Y(0)); cx.lineTo(X(b.re), Y(-b.de)); cx.stroke();
    cx.setLineDash([]);
    cx.fillStyle = '#34d399'; cx.font = `11px ${FN}`; cx.textAlign = 'left';
    cx.fillText(`rₑ = ${b.re} pm (−${b.de} kJ/mol)`, X(b.re) + 6, Y(-b.de) + 4);

    const curE = morse(distPm, b);
    cx.fillStyle = '#f59e0b'; cx.beginPath(); cx.arc(X(distPm), Y(curE), 7, 0, 6.283); cx.fill();

    cx.fillStyle = '#9fb0d8'; cx.font = `11.5px ${FN}`; cx.textAlign = 'left';
    cx.fillText('Energía potencial E (kJ·mol⁻¹)', gx + 8, gy + 15);
    cx.fillText('E = 0 (átomos separados)', gx + 8, Y(0) - 5);
    cx.textAlign = 'right'; cx.fillText('Distancia internuclear r (pm) →', gx + gw, gy + gh + 16);
    cx.textAlign = 'left'; cx.fillText('Modelo tipo Morse: ilustra equilibrio y orden de enlace sin cálculo cuántico completo.', 20, 410, 660);
  }

  return {
    mount() {
      ask({
        ph: 'Predice:', q: '¿Qué ocurre con la energía potencial si acercamos dos átomos mucho más allá de su distancia de equilibrio?',
        o: ['Baja indefinidamente hasta −∞', 'Sube bruscamente por repulsión entre núcleos y nubes electrónicas', 'Permanece constante'],
        ok: 1, key: 'cov-1-predict',
        good: '¡Bien! A distancias muy cortas domina la repulsión y la energía se dispara.',
        bad: 'Casi… 🤔 Piensa en qué pasa cuando los núcleos positivos se acercan demasiado.',
        done: () => { }
      });
      $('#mis').append(vw);
      buildControls();
      makeDrag([atomA, atomB], {
        move: a => {
          distPm = Math.round(Math.max(45, Math.min(280, 40 + 2 * Math.max(0, a === atomA ? CC - a.x : a.x - CC) / 1.15)));
          checkState(); syncUI();
        }
      });
    },
    update() {}, draw, teardown() {}
  };
};

SC['cov-2'] = sd => {

    if (m < 1.85 && d < 0.8) return { reg: 'metal', txt: 'Carácter metálico (baja electronegatividad media y ΔEN pequeña)' };

  const isSel = q => !!q && q.xa === xa && q.xb === xb && q.a === la && q.b === lb;

/* ===== Covalente 3: diamante frente a grafito ===== */
SC['cov-3'] = sd => {
  const FN = '"Trebuchet MS",system-ui,sans-serif', SQ3 = Math.sqrt(3);
  const BX = 205, SX = 330, WY = 52;
  let predicted = true, mat = 'diamond', shear = 0, batOn = false, pol = 1, explained = false, tt = 0, dYaw = 0.5, dTilt = 0.42, dDrag = null, gYaw = -0.35, gTilt = 0.17;
  const testedShear = new Set(), testedCond = new Set(), vw = document.createElement('div');

  /* Proyección ortográfica: y hacia arriba, z hacia el observador; yaw gira alrededor de la vertical y tilt inclina la vista */
  const proj = (x, y, z, yaw, tilt, ox, oy) => {
    const c = Math.cos(yaw), s = Math.sin(yaw), xr = x * c + z * s, zr = -x * s + z * c, ct = Math.cos(tilt), st = Math.sin(tilt);
    return { x: ox + xr, y: oy - (y * ct - zr * st), d: y * st + zr * ct };
  };

  /* DIAMANTE: red cúbica (fcc + base en (¼,¼,¼)). Se muestra un C central, sus 4 vecinos (tetraedro regular, 109,5°)
     y los vecinos de estos: la red sigue en las tres direcciones (rabillos discontinuos). */
  const DIA = (() => {
    const all = [], bl = SQ3 / 4, dist = (p, q) => Math.hypot(p[0] - q[0], p[1] - q[1], p[2] - q[2]);
    for (let i = -2; i <= 2; i++) for (let j = -2; j <= 2; j++) for (let k = -2; k <= 2; k++)
      for (const f of [[0, 0, 0], [0, .5, .5], [.5, 0, .5], [.5, .5, 0]]) {
        all.push([i + f[0], j + f[1], k + f[2]], [i + f[0] + .25, j + f[1] + .25, k + f[2] + .25]);
      }
    const nbrs = p => all.filter(q => Math.abs(dist(p, q) - bl) < .01);
    const c0 = all.find(p => dist(p, [.25, .25, .25]) < 1e-6);
    const W = [c0], depth = [0], idx = p => W.findIndex(q => dist(p, q) < 1e-6);
    let fr = [c0];
    for (let d = 1; d <= 2; d++) { const nf = []; for (const p of fr) for (const q of nbrs(p)) if (idx(q) < 0) { W.push(q); depth.push(d); nf.push(q); } fr = nf; }
    const B = [], stubs = [];
    for (let i = 0; i < W.length; i++) for (let j = i + 1; j < W.length; j++) if (Math.abs(dist(W[i], W[j]) - bl) < .01) B.push([i, j]);
    W.forEach((p, i) => { if (depth[i] === 2) for (const q of nbrs(p)) if (idx(q) < 0) stubs.push([i, [(q[0] - p[0]) * .5, (q[1] - p[1]) * .5, (q[2] - p[2]) * .5]]); });
    const P = W.map(p => ({ x: p[0] - c0[0], y: p[1] - c0[1], z: p[2] - c0[2] }));
    const R = Math.max(...P.map(p => Math.hypot(p.x, p.y, p.z))) + .12;
    return { P, B, depth, stubs, R, c: 0, nb: [1, 2, 3, 4] };
  })();

  /* GRAFITO: capas de panal (3 enlaces σ por C a 120°) apiladas en ABA; el 4.º electrón de cada C forma la nube π entre capas */
  const GB = 24, GG = 78, GYAW = -0.35, GTILT = 0.17, LOBE = 11;
  const GRA = (() => {
    const raw = [];
    for (let j = 0; j < 4; j++) for (let i = 0; i < 7; i++) {
      const ax = (i - Math.floor(j / 2)) * SQ3 * GB + j * SQ3 * GB / 2, az = j * 1.5 * GB;
      raw.push({ x: ax, z: az }, { x: ax, z: az + GB });
    }
    const mx = raw.reduce((s, p) => s + p.x, 0) / raw.length, mz = raw.reduce((s, p) => s + p.z, 0) / raw.length;
    const P = raw.map(p => ({ x: p.x - mx, z: p.z - mz })), B = [];
    for (let i = 0; i < P.length; i++) for (let j = i + 1; j < P.length; j++)
      if (Math.abs(Math.hypot(P[i].x - P[j].x, P[i].z - P[j].z) - GB) < 1) B.push([i, j]);
    const S = [], H = SQ3 / 2;
    P.forEach((p, i) => {
      const sg = i % 2 ? -1 : 1;
      for (const [vx, vz] of [[0, sg], [H, -.5 * sg], [-H, -.5 * sg]])
        if (!P.some(q => Math.hypot(q.x - p.x - vx * GB, q.z - p.z - vz * GB) < 1)) S.push([i, vx * GB * .55, vz * GB * .55]);
    });
    const xs = P.map(p => p.x), zs = P.map(p => p.z);
    return { P, B, S, xmin: Math.min(...xs), xmax: Math.max(...xs), zmin: Math.min(...zs), zmax: Math.max(...zs) };
  })();
  const gOff = idx => idx === 1 ? { x: 0, z: GB } : { x: 0, z: 0 };
  const gShear = idx => idx === 0 ? shear * 55 : idx === 1 ? shear * 25 : 0;
  const gY = idx => (1 - idx) * GG;
  const gel = [0, 1].map(() => Array.from({ length: 10 }, () => ({
    u: GRA.xmin + rnd() * (GRA.xmax - GRA.xmin), z: GRA.zmin + 8 + rnd() * (GRA.zmax - GRA.zmin - 16), ph: rnd() * 6.283
  })));
  const gPairs = [];
  GRA.P.forEach((a, i) => {
    if (i % 9) return;
    const j = GRA.P.findIndex(b => Math.hypot(b.x - a.x, b.z + GB - a.z) < 1);
    if (j >= 0) gPairs.push([i, j]);
  });

  function update(dt) {
    tt += dt;
    if (mat === 'diamond' && !RM && !dDrag) dYaw += dt * 0.45;
    if (mat === 'diamond' && shear > 0) shear = Math.max(0, shear - dt * 2.5);
    const conducts = batOn && mat === 'graphite', dir = pol > 0 ? 1 : -1;
    for (const g of gel) for (const e of g) {
      if (conducts) {
        e.u += dir * 78 * dt;
        if (e.u > GRA.xmax + 14) e.u = GRA.xmin - 14;
        if (e.u < GRA.xmin - 14) e.u = GRA.xmax + 14;
      } else {
        e.u = Math.max(GRA.xmin, Math.min(GRA.xmax, e.u + Math.sin(tt * 1.7 + e.ph) * 16 * dt));
      }
      e.z = Math.max(GRA.zmin + 6, Math.min(GRA.zmax - 6, e.z + Math.sin(tt * 1.1 + e.ph * 2.3) * 9 * dt));
    }
  }

  function note(lines, x, y, col, tx, ty) {

    cx.restore();
  }

  function drawDiamond() {
    const S = 112 / DIA.R, yaw = dYaw, tilt = dTilt;
    const vib = shear > 0 && !RM ? Math.sin(performance.now() * 0.08) * 3 * shear : 0;
    const pr = (x, y, z) => proj(x * S, y * S, z * S, yaw, tilt, 330 + vib, 250);
    const pts = DIA.P.map(p => pr(p.x, p.y, p.z)), cp = pts[DIA.c];
    cx.save();
    cx.fillStyle = 'rgba(34,211,238,0.12)'; cx.strokeStyle = 'rgba(125,211,252,0.6)'; cx.lineWidth = 1.2; cx.setLineDash([4, 4]);
    for (const f of [[0, 1, 2], [0, 1, 3], [0, 2, 3], [1, 2, 3]]) {
      cx.beginPath(); f.forEach((k, i) => { const q = pts[DIA.nb[k]]; i ? cx.lineTo(q.x, q.y) : cx.moveTo(q.x, q.y); }); cx.closePath(); cx.fill(); cx.stroke();
    }
    cx.setLineDash([3, 4]); cx.strokeStyle = 'rgba(125,211,252,0.45)'; cx.lineWidth = 2; cx.lineCap = 'round'; cx.beginPath();
    for (const [i, v] of DIA.stubs) {
      const p = DIA.P[i], q = pr(p.x + v[0], p.y + v[1], p.z + v[2]);
      cx.moveTo(pts[i].x, pts[i].y); cx.lineTo(q.x, q.y);
    }
    cx.stroke();
    cx.restore();
    const items = [];
    DIA.B.forEach(([i, j]) => items.push({ z: (pts[i].d + pts[j].d) / 2 - 1, bond: [i, j] }));
    pts.forEach((p, i) => items.push({ z: p.d, atom: i }));
    items.sort((a, b) => a.z - b.z);
    cx.lineCap = 'round';
    for (const it of items) {
      if (it.bond) {
        const [i, j] = it.bond, hot = i === DIA.c || j === DIA.c;
        cx.strokeStyle = hot ? '#22d3ee' : '#3b82a6'; cx.lineWidth = hot ? 4.5 : 3;
        cx.beginPath(); cx.moveTo(pts[i].x, pts[i].y); cx.lineTo(pts[j].x, pts[j].y); cx.stroke();
      } else {
        const i = it.atom, p = pts[i], zn = p.d / (S * DIA.R), r = 10 + 2.4 * zn, hot = i === DIA.c, d = DIA.depth[i];
        cx.globalAlpha = .62 + .38 * (zn + 1) / 2;
        const g = cx.createRadialGradient(p.x - r * .3, p.y - r * .3, 1, p.x, p.y, r);
        if (hot) { g.addColorStop(0, '#ecfeff'); g.addColorStop(1, '#22d3ee'); }
        else if (d === 1) { g.addColorStop(0, '#7dd3fc'); g.addColorStop(1, '#0e7490'); }
        else { g.addColorStop(0, '#475569'); g.addColorStop(1, '#0f1730'); }
        cx.fillStyle = g; cx.strokeStyle = hot ? '#ecfeff' : '#7dd3fc'; cx.lineWidth = 2;
        cx.beginPath(); cx.arc(p.x, p.y, r, 0, 6.283); cx.fill(); cx.stroke();
        if (d < 2) { cx.fillStyle = '#060a18'; cx.font = `bold 11px ${FN}`; cx.textAlign = 'center'; cx.fillText('C', p.x, p.y + 4); }
        cx.globalAlpha = 1;
      }
    }
    note(['Tetraedro regular', 'C central + 4 vecinos', 'Ángulo C–C–C ≈ 109,5°', 'Hibridación sp³'], 548, 168, '#7dd3fc', cp.x + 14, cp.y);
    cx.fillStyle = '#e8eeff'; cx.font = `bold 13px ${FN}`; cx.textAlign = 'center';
    cx.fillText('Diamante: cada C forma 4 enlaces σ hacia los vértices de un tetraedro → red 3D rígida', 350, 382, 640);
  }

  function drawGraphite(conducts) {
    const OX = 330, OY = 246, P = (x, y, z) => proj(x, y, z, gYaw, gTilt, OX, OY), ct = Math.cos(gTilt);
    const corners = (yy, dxa) => [[GRA.xmin - 10, GRA.zmin - 10], [GRA.xmax + 10, GRA.zmin - 10], [GRA.xmax + 10, GRA.zmax + 10], [GRA.xmin - 10, GRA.zmax + 10]].map(([x, z]) => P(x + dxa, yy, z));
    /* nube π entre láminas (plano medio de cada hueco) */
    for (let g = 0; g < 2; g++) {
      const ym = (gY(g) + gY(g + 1)) / 2, c = corners(ym, (gShear(g) + gShear(g + 1)) / 2);
      cx.fillStyle = conducts ? 'rgba(253,224,71,0.13)' : 'rgba(167,139,250,0.10)';
      cx.strokeStyle = conducts ? 'rgba(253,224,71,0.55)' : 'rgba(196,181,253,0.45)'; cx.lineWidth = 1.5;
      cx.beginPath(); c.forEach((q, i) => i ? cx.lineTo(q.x, q.y) : cx.moveTo(q.x, q.y)); cx.closePath(); cx.fill(); cx.stroke();
    }
    /* lóbulos π (orbitales p) sobre y bajo cada átomo */
    for (let idx = 2; idx >= 0; idx--) {
      const o = gOff(idx), dx = gShear(idx);
      for (const dir of [1, -1]) {
        const inner = (dir === -1 && idx < 2) || (dir === 1 && idx > 0);
        cx.fillStyle = conducts ? `rgba(253,224,71,${inner ? .12 : .06})` : `rgba(196,181,253,${inner ? .13 : .07})`;
        cx.beginPath();
        for (const a of GRA.P) {
          const q = P(a.x + o.x + dx, gY(idx) + dir * LOBE, a.z + o.z);
          cx.moveTo(q.x + 4, q.y); cx.ellipse(q.x, q.y, 4, 10 * ct, 0, 0, 6.283);
        }
        cx.fill();
      }
    }
    /* láminas: enlaces σ y átomos */
    for (let idx = 2; idx >= 0; idx--) {
      const o = gOff(idx), dx = gShear(idx), q = GRA.P.map(a => P(a.x + o.x + dx, gY(idx), a.z + o.z));
      cx.strokeStyle = '#a78bfa'; cx.lineWidth = 1.5; cx.lineCap = 'round'; cx.beginPath();
      for (const [i, j] of GRA.B) { cx.moveTo(q[i].x, q[i].y); cx.lineTo(q[j].x, q[j].y); }
      cx.stroke();
      /* rabillos discontinuos: la red sigue más allá del borde (cada C tiene siempre 3 vecinos) */
      cx.save(); cx.setLineDash([2, 2]); cx.strokeStyle = 'rgba(167,139,250,.55)'; cx.lineWidth = 1.2; cx.beginPath();
      for (const [i, vx, vz] of GRA.S) { const a = GRA.P[i], r = P(a.x + vx + o.x + dx, gY(idx), a.z + vz + o.z); cx.moveTo(q[i].x, q[i].y); cx.lineTo(r.x, r.y); }
      cx.stroke(); cx.restore();
      cx.fillStyle = '#ede9fe'; cx.strokeStyle = '#7c3aed'; cx.lineWidth = 1;
      for (const p of q) { cx.beginPath(); cx.arc(p.x, p.y, 2.4, 0, 6.283); cx.fill(); cx.stroke(); }
    }
    /* interacción débil entre capas */
    cx.save(); cx.setLineDash([3, 4]); cx.strokeStyle = 'rgba(159,176,216,.55)'; cx.lineWidth = 1.3; cx.beginPath();
    for (let g = 0; g < 2; g++) {
      const A = g === 0 ? 0 : 1;
      for (const [i, j] of gPairs) {
        const a = GRA.P[i], b = GRA.P[j];
        if (g === 0) { const p = P(a.x + gShear(0), gY(0), a.z), r = P(b.x + gShear(1), gY(1), b.z + GB); cx.moveTo(p.x, p.y); cx.lineTo(r.x, r.y); }
        else { const p = P(b.x + gShear(1), gY(1), b.z + GB), r = P(a.x + gShear(2), gY(2), a.z); cx.moveTo(p.x, p.y); cx.lineTo(r.x, r.y); }
      }
    }
    cx.stroke(); cx.restore();
    /* electrones: corren por el plano de las capas, ENTRE lámina y lámina */
    const dir = pol > 0 ? 1 : -1;
    gel.forEach((g, gi) => {
      const ym = (gY(gi) + gY(gi + 1)) / 2, dx = (gShear(gi) + gShear(gi + 1)) / 2;
      for (const e of g) {
        const p = P(e.u + dx, ym + Math.sin(tt * 2 + e.ph) * 2.5, e.z);
        if (conducts) {
          const tr = P(e.u + dx - dir * 12, ym, e.z);
          cx.strokeStyle = 'rgba(254,249,195,.4)'; cx.lineWidth = 1.4; cx.lineCap = 'round';
          cx.beginPath(); cx.moveTo(tr.x, tr.y); cx.lineTo(p.x, p.y); cx.stroke();
        }
        cx.save(); cx.shadowColor = '#fef08a'; cx.shadowBlur = 4; cx.fillStyle = '#fef9c3';
        cx.beginPath(); cx.arc(p.x, p.y, 1.7, 0, 6.283); cx.fill(); cx.restore();
      }
    });
    /* anotaciones */
    const yTop = P(0, gY(0), 0), yg0 = P(GRA.xmax * .2, (gY(0) + gY(1)) / 2, 0), yg1 = P(GRA.xmax * .2, (gY(1) + gY(2)) / 2, 0);
    note(['Enlaces σ sp² en cada capa', '3 por C · 120° · muy fuertes'], 548, yTop.y - 22, '#c4b5fd', yTop.x + 40, yTop.y);
    note(['Nube π deslocalizada', 'entre lámina y lámina', conducts ? 'e⁻ corriendo por el plano' : 'e⁻ móviles en el plano'], 548, yg0.y - 14, '#fde047', yg0.x + 70, yg0.y);
    note(['Interacción débil entre', 'capas (≈ 335 pm)'], 548, yg1.y + 6, '#9fb0d8', yg1.x + 70, yg1.y);
    cx.fillStyle = '#e8eeff'; cx.font = `bold 13px ${FN}`; cx.textAlign = 'center';
    cx.fillText('Grafito: 3 enlaces σ por C en capas planas + nube π de electrones entre capas', 350, 382, 640);
  }

  function draw() {
    bg();
    const isG = mat === 'graphite', conducts = batOn && isG;

    cx.strokeStyle = conducts ? '#fde047' : '#64748b'; cx.lineWidth = 2.5;
    cx.beginPath(); cx.moveTo(150, 120); cx.lineTo(150, WY); cx.lineTo(BX - 42, WY);

    cx.fillStyle = '#9fb0d8'; cx.font = `11px ${FN}`;
    cx.fillText(isG ? 'Esquema: distancias entre capas exageradas; la conductividad es alta en el plano y baja perpendicularmente. Arrástralo para girarlo.' : 'Esquema: un C, sus 4 vecinos y los vecinos de estos (gira sola; arrástralo para girarlo tú). Los rabillos discontinuos indican que la red continúa.', 18, 405, 666);
  }

  return {
    mount() {
      ask({
        ph: 'Predice:', q: '¿Por qué el grafito se usa en las minas de lápiz para dejar trazo sobre el papel?',
        o: ['Porque sus capas tienen interacciones débiles entre sí y se deslizan unas sobre otras', 'Porque se funde con el calor de la mano', 'Porque sus átomos no tienen enlaces covalentes'],
        ok: 0, key: 'cov-3-predict',
        good: '¡Bien! Dentro de cada capa los enlaces son muy fuertes, pero entre capas las fuerzas son débiles.',
        bad: 'Casi… 🤔 Piensa en la estructura laminar del grafito.',
        done: () => { }
      });
      $('#mis').append(vw);
      buildControls();
      cv.style.touchAction = 'none';
      on(cv, 'pointerdown', e => {
        const p = lc(e); if (p.y < 125) return;
        dDrag = { x: e.clientX, y: e.clientY }; cv.setPointerCapture(e.pointerId); e.preventDefault();
      });
      on(cv, 'pointermove', e => {
        if (!dDrag) return;
        const r = cv.getBoundingClientRect(), k = W / r.width;
        const dx = (e.clientX - dDrag.x) * k * .012, dy = (e.clientY - dDrag.y) * k * .012;
        if (mat === 'diamond') { dYaw += dx; dTilt = Math.max(-1.3, Math.min(1.3, dTilt + dy)); }
        else { gYaw += dx; gTilt = Math.max(-1.3, Math.min(1.3, gTilt + dy)); }
        dDrag.x = e.clientX; dDrag.y = e.clientY;
      });
