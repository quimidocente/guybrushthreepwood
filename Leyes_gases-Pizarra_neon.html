<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Leyes de los gases · Pizarra neón</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&display=swap">
<style>
:root{color-scheme:dark;--cy:#2ff3ff;--mg:#ff5cc0;--lm:#2bff6e;--ye:#ffe94a;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:inherit}
html,body{margin:0;height:100%;background:#000}
body{display:flex;flex-direction:column;align-items:center;justify-content:center;font-family:'Caveat','Segoe Print','Bradley Hand',cursive}
svg{width:100%;max-width:1700px;height:auto;max-height:calc(100% - 56px);display:block}
.c{--k:var(--cy)}.m{--k:var(--mg)}.l{--k:var(--lm)}.y{--k:var(--ye)}
.s{fill:none;stroke:var(--k);stroke-width:3.5;stroke-linecap:round;stroke-linejoin:round}
.f{stroke-width:2.4}
.t{fill:var(--k);font-size:40px;font-weight:700}
.sm{font-size:32px}.md{font-size:44px}.lg{font-size:54px}
.ar{font-family:'Segoe UI Symbol','DejaVu Sans',Arial,sans-serif;font-weight:900}
.anim .s{stroke-dasharray:1;stroke-dashoffset:1;animation:d 1s ease-out forwards;animation-delay:var(--d)}
.anim .t{opacity:0;animation:f .6s ease-out forwards;animation-delay:var(--d)}
@keyframes d{to{stroke-dashoffset:0}}
@keyframes f{to{opacity:1}}
.h-pool .bub{animation:rise 2.2s ease-in infinite}
@keyframes rise{0%{transform:translate(0,0);opacity:1}80%{opacity:1}100%{transform:translate(6px,var(--r));opacity:0}}
.h-balloon .wv{animation:wv .7s ease-in-out infinite alternate}
.h-balloon .wvl{animation:wvl .7s ease-in-out infinite alternate}
@keyframes wv{from{transform:rotate(-70deg)}to{transform:rotate(-120deg)}}
@keyframes wvl{from{transform:rotate(70deg)}to{transform:rotate(120deg)}}
.h-snail .ant{animation:wig .5s ease-in-out infinite alternate}
.h-snail .ant2{animation:wig .5s ease-in-out infinite alternate-reverse}
@keyframes wig{from{transform:rotate(-18deg)}to{transform:rotate(18deg)}}
.hrt{opacity:0}
.h-love .hrt{animation:love 1.8s ease-out infinite}
@keyframes love{0%{opacity:0;transform:translate(0,0) scale(.5)}20%{opacity:1}100%{opacity:0;transform:translate(var(--x),-100px) scale(1.1)}}
#pa{transform-box:fill-box;transform-origin:center}
.h-aitor #pa{animation:fall 4s ease-in-out infinite}
.h-aitor #pw{animation:surf 4s linear infinite}
@keyframes fall{0%,8%{transform:none;opacity:1}30%{transform:translate(25px,45px) rotate(40deg);opacity:1}50%{transform:translate(40px,110px) rotate(80deg);opacity:1}75%{transform:translate(18px,320px) rotate(90deg);opacity:1}85%{transform:translate(18px,330px) rotate(90deg);opacity:0}97%{transform:none;opacity:0}100%{transform:none;opacity:1}}
@keyframes surf{0%,72%{opacity:0}80%,95%{opacity:1}100%{opacity:0}}
.h-pot .fl{animation:flame .5s ease-in-out infinite alternate}
@keyframes flame{from{transform:skewX(-12deg) scaleY(.92)}to{transform:skewX(12deg) scaleY(1.12)}}
.h-pot .stm{animation:steam 1.6s ease-out infinite}
@keyframes steam{0%{opacity:0;transform:translate(0,8px)}30%{opacity:1}100%{opacity:0;transform:translate(8px,-34px)}}
button{margin:8px 0 10px;background:none;border:2px solid var(--cy);color:var(--cy);font:700 22px 'Caveat',cursive;padding:4px 22px;border-radius:999px;cursor:pointer;text-shadow:0 0 8px var(--cy);box-shadow:0 0 10px var(--cy),inset 0 0 10px rgba(47,243,255,.3)}
button:focus-visible{outline:3px solid var(--ye);outline-offset:3px}
@media (prefers-reduced-motion:reduce){.anim .s,.anim .t{animation-duration:.01s;animation-delay:0s!important}}
</style>
</head>

<script>
(function(){
  var svg=document.getElementById('b');
  function P(id,x,y,o){
    o=o||{};
    var a=o.a!==undefined?o.a:"M0 38 L-26 66 M0 38 L26 66";
    var l=o.l!==undefined?o.l:"M0 76 L-16 130 M0 76 L16 130";
    var eyes=o.x?'<path class="s f" d="M-8 -8 L-2 -2 M-2 -8 L-8 -2 M2 -8 L8 -2 M8 -8 L2 -2"/>':'<circle class="s f" cx="-5" cy="-5" r="1"/><circle class="s f" cx="5" cy="-5" r="1"/>';
    var h='<g transform="translate('+x+' '+y+') rotate('+(o.r||0)+')">'+
      '<ellipse class="s" rx="13" ry="18"/>'+eyes+
      '<path class="s f" d="M0 -1 L-2 6 L2 6"/><path class="s f" d="M-6 10 Q0 15 6 10"/>'+
      (o.hair?'<path class="s" d="M-10 -14 L-16 -26 M-4 -17 L-6 -31 M3 -17 L5 -31 M10 -14 L17 -26"/>':'')+
      (o.nb?'':'<path class="s" d="M0 18 L0 76 '+a+' '+l+'"/>')+(o.w?'<g transform="translate(0 38)"><g class="'+(o.w>0?'wv':'wvl')+'"><path class="s" d="M0 0 L'+(22*o.w)+' 22"/></g></g>':'')+'</g>';
    document.getElementById(id).insertAdjacentHTML('beforeend',h);
  }
  P('pa',317,317,{r:75,nb:1});
  P('pw',350,650,{r:90,x:1,a:"M0 38 L-24 64 M0 38 L24 64",l:"M0 76 L-16 118 M0 76 L16 118"});
  P('pc',710,440,{w:-1,a:"M0 38 L22 60",l:""});
  P('pc',770,440,{hair:1,w:1,a:"M0 38 L-22 60",l:""});
  P('pg',1190,640,{a:"M0 38 L-26 72 M0 38 L56 66"});
  P('pg',1300,640,{hair:1,a:"M0 38 L-54 66 M0 38 L26 72"});
  svg.querySelectorAll('.s').forEach(function(e){e.setAttribute('pathLength','1')});
  function play(){
    svg.classList.remove('anim');
    void svg.getBoundingClientRect();
    var i=0;
    svg.querySelectorAll('.s,.t').forEach(function(e){
      e.style.setProperty('--d',Math.min(i*0.04,7).toFixed(2)+'s');i++;
    });
    svg.classList.add('anim');
  }
  var running=false,names=['pool','balloon','snail','love','aitor','pot'];
  [['pool',185,365,265,375],['balloon',600,95,280,470],['snail',725,630,235,130],['love',1120,600,250,190],['aitor',215,268,130,97],['pot',1190,120,320,430]].forEach(function(z){
    var e=document.createElementNS('http://www.w3.org/2000/svg','rect');
    e.setAttribute('x',z[1]);e.setAttribute('y',z[2]);e.setAttribute('width',z[3]);e.setAttribute('height',z[4]);
    e.setAttribute('fill','transparent');e.setAttribute('pointer-events','all');
    e.addEventListener('pointerenter',function(){svg.classList.add('h-'+z[0])});
    e.addEventListener('pointerleave',function(){if(!running)svg.classList.remove('h-'+z[0])});
    svg.appendChild(e);
  });
  var btn=document.getElementById('r');
  btn.addEventListener('click',function(){
    running=!running;
    names.forEach(function(n){svg.classList.toggle('h-'+n,running)});
    btn.textContent=running?'Parar':'Dale marcha';
    btn.setAttribute('aria-pressed',String(running));
  });
  play();
})();
</script>
