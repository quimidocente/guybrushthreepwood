.sat{width:37%;height:37%}

.auto{border-style:dashed;border-color:var(--au);background:color-mix(in srgb,var(--au) 14%,var(--cd))}
.bad{animation:sh .35s}

.pt{position:absolute;left:50%;top:50%;width:9px;height:9px;border-radius:50%;pointer-events:none}

  const e=$(k),s=st[k];
  e.className="node "+(k==="f"?"":"sat "+k)+(s.ok?" ok":"")+(s.auto?" auto":"")+(s.rev?" rev":"");
  if(k==="f")e.style.setProperty("--c",(EP[d.el]||[0,0,"#7a4fc0"])[2]);
  if(s.ok){e.innerHTML=`<small>${label(k)}</small><div class="v">${first(k)}</div>`;return}
  e.innerHTML=`<small>${label(k)}</small><input id="i${k}" autocomplete="off" autocapitalize="off" spellcheck="false" aria-label="${label(k)}"><div class="t" aria-hidden="true">${tdots(s.t)}</div>`;
  $("i"+k).addEventListener("keydown",ev=>{if(ev.key==="Enter")check()});
}
function build(){
  const o=$("orb");fin=false;
  document.documentElement.style.setProperty("--g",FG[d.c]);
  const ks=d.a?["f","p","s","a","o"]:["f","p","s","o"];
  o.className=d.a?"four":"";
  o.innerHTML='<div class="ring r1"></div><div class="ring r2"></div><div class="ring r3"></div>'+ks.map(k=>`<div class="node${k==="f"?"":" sat "+k}" id="${k}"></div>`).join("");
  st={};
  ks.forEach(k=>{const given=mode==="n"?k==="f":k!=="f";st[k]={t:0,ok:given,auto:false};draw(k)});
  $("msg").textContent=mode==="n"?"Nombra este compuesto de las tres formas. Pulsa Intro para comprobar tus respuestas.":"Escribe la fórmula a partir de los nombres. Pulsa Intro para comprobar tu intento.";
  const i=document.querySelector("#orb input");if(i)i.focus();
}
const pool0=c=>D.filter(x=>c==="t"||x.c===c).length;
function next(){
  const pool=D.filter(x=>(cat==="t"||x.c===cat)&&(x!==d||pool0(cat)<2));
  d=pool[Math.floor(Math.random()*pool.length)];build();
}
const HINTS=["¡Casi! Revisa los prefijos y el número de oxidación.","Sin rendirse: mira el signo y el subíndice.","Cada fallo es una pista. Respira y prueba otra vez.","¡Tú puedes! Fíjate en la terminación del nombre."];
function check(only){
  if(fin)return;
  let any=false;
  Object.keys(st).forEach(k=>{
    if(only&&k!==only)return;
    const s=st[k];if(s.ok)return;
    const inp=$("i"+k);if(!inp||!inp.value.trim())return;
    any=true;
    if(test[k](inp.value)){s.ok=true;hits++;draw(k);beep([[660,0,.12],[880,.09,.16]])}
    else{
      s.t++;const e=$(k);beep([[200,0,.25]]);
      if(s.t>=3){s.ok=true;s.auto=true;s.rev=true;aids++;draw(k);$("msg").textContent="Te echo una mano: este círculo se rellena solo. Fíjate bien en la respuesta.";setTimeout(()=>{if(st[k]!==s)return;s.rev=false;draw(k);settle()},1400)}
      else{e.classList.remove("bad");void e.offsetWidth;e.classList.add("bad");e.querySelector(".t").innerHTML=tdots(s.t);$("msg").textContent=HINTS[Math.floor(Math.random()*HINTS.length)]+(d.n&&s.t===2?" Pista: "+d.n:"");inp.select()}
    }
  });
  settle();hud();
}
function settle(){if(!fin&&Object.values(st).every(s=>s.ok&&!s.rev))finish()}
function burst(){
  if(matchMedia("(prefers-reduced-motion:reduce)").matches)return;
  const o=$("orb"),cols=[...els(d.f).map(e=>(EP[e]||[0,0,"#7a4fc0"])[2]),"#c99a12","#c0398f","#2f78c4"];
  for(let i=0;i<36;i++){const p=document.createElement("div");p.className="pt";p.style.background=cols[i%cols.length];o.appendChild(p);
    const a=Math.random()*6.28,r=90+Math.random()*190;
    p.animate([{transform:"translate(-50%,-50%) scale(1)",opacity:1},{transform:`translate(${Math.cos(a)*r}px,${Math.sin(a)*r}px) scale(.2)`,opacity:0}],{duration:900+Math.random()*600,easing:"cubic-bezier(.1,.7,.3,1)"}).onfinish=()=>p.remove()}
}
function finish(){
  fin=true;$("orb").classList.add("done");
  const auto=Object.values(st).some(s=>s.auto),before=lvl(S.xp);
  let extra="";
  if(!auto){
    S.streak++;S.best=Math.max(S.best,S.streak);
    const gain=Math.round(20*(1+Math.min(S.streak-1,4)*.5));S.xp+=gain;
    const nw=els(d.f).filter(e=>EP[e]&&!S.lit.includes(e));S.lit.push(...nw);
    extra=`<br><b style="color:var(--o)">+${gain} XP</b>`+(S.streak>1?` · racha de ${S.streak}`:"")+(nw.length?` · ¡Nuevo en tu tabla: ${nw.join(", ")}!`:"");
    burst();beep([[523,0,.14],[659,.1,.14],[784,.2,.14],[1047,.3,.3]]);
  }else{S.streak=0;S.xp+=5;extra=`<br><span style="color:var(--au)">Racha a cero, pero +5 XP por intentarlo. Repite este compuesto más tarde.</span>`}
  if(lvl(S.xp)>before)extra+=`<br><b style="color:var(--a)">¡Subes a ${LV[lvl(S.xp)][1]}!</b>`;
  save();
  $("msg").innerHTML=`<b>${fx(d.f)}</b>: ${d.p[0]} · ${d.s[0]}${d.a?" · "+d.a[0]:""} · ${d.el} ${sg(d.o)}`+(d.n?`<br><span style="color:var(--mu)">${d.n}</span>`:"")+extra;
  hud();
}
function hud(){
  const i=lvl(S.xp),a=LV[i][0],b=LV[i+1]?LV[i+1][0]:a+1,pc=LV[i+1]?(S.xp-a)/(b-a)*100:100;
  $("hud").innerHTML=`<div class="r"><span><b>${LV[i][1]}</b> · ${S.xp} XP</span><span>Racha ${S.streak} (mejor ${S.best}) · Ayudas ${aids}</span></div><div id="bar"><i style="width:${pc}%"></i></div>`;
  const t=$("pt");t.innerHTML="";
  Object.entries(EP).forEach(([e,[g,p,c]])=>{const x=document.createElement("div");x.textContent=e;x.style.gridColumn=g;x.style.gridRow=p;x.style.setProperty("--c",c);if(S.lit.includes(e))x.className="on";t.appendChild(x)});
  $("ptl").textContent=`Tu tabla periódica: ${S.lit.length} de ${Object.keys(EP).length} elementos`;
}
$("nx").onclick=()=>next();
$("snd").onclick=()=>{mute=!mute;$("snd").textContent=mute?"Sonido: no":"Sonido: sí"};
$("rst").onclick=()=>{if(confirm("¿Borrar tu progreso?")){S={xp:0,streak:0,best:0,lit:[]};save();hud()}};
chips("cats",CATS,()=>cat,v=>cat=v);chips("modes",MODES,()=>mode,v=>mode=v);
hud();next();
</script></body></html>
