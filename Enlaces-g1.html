/* ===== Metálico 1: mar de electrones ===== */
SC['met-1'] = sd => {
  const FN = '"Trebuchet MS",system-ui,sans-serif';
  let predicted = true, batOn = false, pol = 1, tempK = 300, highTempTested = false, explained = false;
  const cores = [], elecs = [], vw = document.createElement('div');

  for (let r = 0; r < 4; r++) for (let c = 0; c < 7; c++) {
    cores.push({ bx: 155 + c * 65, by: 165 + r * 52, x: 155 + c * 65, y: 165 + r * 52, ph: rnd() * 6.283 });
  }
  for (let i = 0; i < 42; i++) {
    const a = rnd() * 6.283, sp = 70 + rnd() * 50;
    elecs.push({ x: 120 + rnd() * 460, y: 138 + rnd() * 214, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp });
  }

  const R0 = 10, VOLT = 1.5, fm = (n, d = 1) => n.toFixed(d).replace('.', ',');   // R₀ = 10 Ω a 300 K (valor didáctico); R ∝ T
  const netDrift = () => batOn ? (125 * (300 / tempK)) : 0;

  function checkProgress() {
    if (batOn) {
      flash(2);
      if (star('met-1-drift')) sayPool(WIN, 1);
      if (tempK >= 650 && !highTempTested) {
        highTempTested = true; flash(3);
        if (star('met-1-temp')) sayPool(WIN, 1);
      }
      if (!explained && done['met-1-drift'] && done['met-1-temp']) {
        explained = true;
        ask({
          into: vw, ph: 'Explica:', q: '¿Por qué aumenta la resistencia eléctrica de un metal al elevar la temperatura?',
          o: ['Porque los cationes vibran con mayor amplitud y dispersan más a los electrones en movimiento', 'Porque desaparecen los electrones de valencia', 'Porque los cationes se convierten en aniones'],
          ok: 0, key: null,
          good: '¡Exacto! Más agitación térmica de la red de cationes provoca más colisiones y frena la deriva neta.',
          bad: 'Fíjate en la vibración de los cationes positivos cuando subes la temperatura.'
        });
      }
    }
  }

  function buildControls() {
    vw.innerHTML = '<p><b>Prueba:</b> cierra el interruptor para crear una deriva neta de electrones y luego sube la temperatura para observar la resistencia.</p>'
      + '<div class="bt"><button class="go" id="bBtn">🔌 Cerrar interruptor</button><button id="pBtn">⇄ Invertir polos (pila)</button></div>'
      + `<label>Temperatura del metal <b id="vt1">${tempK} K</b><input type="range" id="T1" min="150" max="900" step="50" value="${tempK}" aria-label="Temperatura del metal"></label>`
      + '<div class="mt" id="m1Stat"></div>';

    const B = $('#bBtn');
    B.onclick = () => {
      batOn = !batOn;
      B.textContent = batOn ? '⏏ Abrir interruptor' : '🔌 Cerrar interruptor';
      B.classList.toggle('on', batOn);
      flash(batOn ? 2 : 1);
      say(batOn ? 'Interruptor cerrado: sobre el movimiento térmico al azar aparece una deriva neta hacia el polo positivo.' : 'Interruptor abierto: los electrones se mueven al azar y la corriente neta es cero.', 1);
      checkProgress(); syncUI();
    };
    $('#pBtn').onclick = () => { pol *= -1; say('Polos invertidos: la deriva de electrones cambia de sentido (siguen yendo hacia el polo +).', 1); syncUI(); };
    $('#T1').oninput = e => { tempK = +e.target.value; $('#vt1').textContent = `${tempK} K`; checkProgress(); syncUI(); };
    vw.append(hintBtn([
      'Con el interruptor abierto los electrones rebotan al azar; ciérralo para ver el flujo neto.',
      'Fíjate en cómo al subir la temperatura vibran más los cationes.',
      'Con el interruptor cerrado, sube la temperatura por encima de 650 K para ver caer la corriente.'
    ]).el);
    syncUI();
  }

  function syncUI() {
    const st = $('#m1Stat'); if (!st) return;
    const relI = batOn ? Math.round((300 / tempK) * 100) : 0, R = R0 * tempK / 300, I = VOLT / R * 1000;
    let html = '';
    if (batOn) {
      const rows = [150, 300, 450, 600, 750, 900], near = rows.reduce((b, x) => Math.abs(x - tempK) < Math.abs(b - tempK) ? x : b, rows[0]);
      html += `<div>🔌 Interruptor cerrado · V = <b>${fm(VOLT)} V</b></div>`
        + `<div>Resistencia: <b>R = ${fm(R)} Ω</b> (${fm(tempK / 300)}×R₀) · Corriente: <b>I = ${Math.round(I)} mA</b></div>`
        + `<div class="bar"><i style="width:${Math.min(100, relI)}%"></i></div>`
        + '<table><tr><th>T (K)</th><th>R (Ω)</th><th>I (mA)</th></tr>'
        + rows.map(x => `<tr${x === near ? ' style="background:#7c3aed55;font-weight:700"' : ''}><td>${x}</td><td>${fm(R0 * x / 300)}</td><td>${Math.round(VOLT / (R0 * x / 300) * 1000)}</td></tr>`).join('')
        + '</table>'
        + `<div class="mu">Al subir T los cationes vibran más y dispersan a los electrones: R aumenta (modelo R ∝ T, con R₀ = ${R0} Ω a 300 K). Deriva exagerada para visualizar.</div>`;
    } else {
      html += `<div>Interruptor abierto: ciérralo para medir R e I.</div>`
        + `<div class="mu">Resistencia relativa: <b>${fm(tempK / 300)}×</b> · Deriva neta = 0 (movimiento térmico aleatorio).</div>`;
    }
    st.innerHTML = html;
  }

  function update(dt) {
    const t = performance.now() / 1000;
    const amp = RM ? 0 : 1.5 + (tempK / 300) * 2.8;
    for (const c of cores) {
      c.x = c.bx + amp * Math.sin(t * (7 + tempK / 90) + c.ph);
      c.y = c.by + amp * Math.cos(t * (6.3 + tempK / 95) + c.ph * 1.2);
    }
    const vd = netDrift() * pol, scatterProb = (tempK / 300) * 2.4 * dt, thSp = 65 * Math.sqrt(tempK / 300);
    for (const e of elecs) {
      if (rnd() < scatterProb) {
        const a = rnd() * 6.283;
        e.vx = Math.cos(a) * thSp; e.vy = Math.sin(a) * thSp;
      }
      e.x += (e.vx + vd) * dt;
      e.y += e.vy * dt;
      if (e.x < 115) e.x = 583;
      if (e.x > 585) e.x = 117;
      if (e.y < 135) { e.y = 135; e.vy = Math.abs(e.vy); }
      if (e.y > 355) { e.y = 355; e.vy = -Math.abs(e.vy); }
    }
  }

  function draw() {
    bg();
    const leftPol = pol > 0 ? '−' : '+', rightPol = pol > 0 ? '+' : '−';
    cx.fillStyle = 'rgba(148, 163, 184, 0.16)'; cx.strokeStyle = '#94a3b8'; cx.lineWidth = 3;
    cx.beginPath(); cx.roundRect(110, 126, 480, 238, 14); cx.fill(); cx.stroke();

    cx.strokeStyle = batOn ? '#fde047' : '#64748b'; cx.lineWidth = 2.5;
    cx.beginPath(); cx.moveTo(110, 245); cx.lineTo(65, 245); cx.lineTo(65, 58); cx.lineTo(193, 58);
    cx.moveTo(277, 58); cx.lineTo(338, 58);
    cx.moveTo(382, 58); cx.lineTo(635, 58); cx.lineTo(635, 245); cx.lineTo(590, 245); cx.stroke();
    drawBattery(235, 58, 84, 40, batOn, pol > 0);
    drawSwitch(360, 58, batOn);
    drawBulb(520, 58, batOn ? Math.min(1, 300 / tempK) : 0);
    if (batOn) { cx.fillStyle = '#fde047'; cx.font = `11px ${FN}`; cx.textAlign = 'center'; cx.fillText('brillo ∝ corriente', 520, 100); }

    for (const c of cores) {
      cx.fillStyle = '#f59e0b'; cx.beginPath(); cx.arc(c.x, c.y, 13, 0, 6.283); cx.fill();
      cx.fillStyle = '#060a18'; cx.font = `bold 13px ${FN}`; cx.textAlign = 'center'; cx.fillText('+', c.x, c.y + 4);
    }
    cx.fillStyle = '#22d3ee';
    for (const e of elecs) { cx.beginPath(); cx.arc(e.x, e.y, 4, 0, 6.283); cx.fill(); }

    if (batOn) {
      cx.fillStyle = '#fde047'; cx.font = `bold 13px ${FN}`; cx.textAlign = 'center';
      cx.fillText(pol > 0 ? 'Deriva neta de e⁻ → (hacia el polo +)' : '← Deriva neta de e⁻ (hacia el polo +)', 350, 114);
    }

    // Dato de resistencia al probar la conductividad
    cx.textAlign = 'center'; cx.font = `bold 12.5px ${FN}`;
    if (batOn) {
      cx.fillStyle = '#fde047';
      cx.fillText(`Medida: V = ${fm(VOLT)} V · R = ${fm(R0 * tempK / 300)} Ω (${fm(tempK / 300)}×R₀) · I = ${Math.round(VOLT / (R0 * tempK / 300) * 1000)} mA · T = ${tempK} K`, 350, 386, 660);
    } else {
      cx.fillStyle = '#9fb0d8'; cx.fillText('Interruptor abierto: púlsalo para cerrar el circuito y medir la resistencia', 350, 386, 660);
    }
    cx.textAlign = 'left'; cx.fillStyle = '#e8eeff'; cx.font = `bold 14px ${FN}`;
    cx.fillText(`Modelo del mar de electrones · T = ${tempK} K`, titleX(), 26);
    cx.fillStyle = '#9fb0d8'; cx.font = `11px ${FN}`;
    cx.fillText('Modelo esquemático: cationes en posiciones de red y electrones de valencia deslocalizados (deriva exagerada).', 18, 405, 666);
  }

  return {
    mount() {
      ask({
        ph: 'Predice:', q: '¿Qué hacen los electrones de valencia de un metal cuando NO está conectado a ninguna pila?',
        o: ['Se mueven continuamente al azar en todas direcciones, sin flujo neto', 'Están completamente congelados sin moverse', 'Salen todos hacia un extremo del metal'],
        ok: 0, key: 'met-1-predict',
        good: '¡Bien! Se mueven al azar con agitación térmica: como van en todas direcciones, la corriente neta es cero.',
        bad: 'Casi… 🤔 Deslocalizados significa móviles, pero sin campo eléctrico no hay dirección privilegiada.',
        done: () => { flash(0); flash(1); }
      });
      $('#mis').append(vw);
      buildControls();
      circuitClicks({ x: 185, y: 32, w: 100, h: 70 }, '#pBtn', { x: 326, y: 24, w: 68, h: 80 }, '#bBtn');
    },
    update, draw, teardown() {}
  };
};

/* ===== Metálico 2: martillazo metálico (maleable y dúctil frente al iónico) ===== */
SC['met-2'] = sd => {
  const FN = '"Trebuchet MS",system-ui,sans-serif';
  let predicted = true, mode = 'metal', force = 65, showSea = true, explained = false;
  let hammerAnim = 0, slipStep = 0, targetStep = 0, hitX = 380, hitY = 120;
  const testedModes = new Set(), vw = document.createElement('div');

  const ionicComp = createCrystalBlock({ cols: 9, rows: 6, sp: 30, cx: 350, benchY: 368 });

  function strike() {
    if (mode === 'ionic') {
      ionicComp.hit(force, 5);
      testedModes.add('ionic');
      checkDone();
      return;
    }
    hammerAnim = 1;
    hitX = 395; hitY = 128;

    if (force < 45) {
      say('Golpe suave: los cationes vibran y recuperan su posición sin deslizarse.', 1);

    testedModes.add('metal');

    else say('¡Las capas de cationes se deslizan y el mar de electrones mantiene la cohesión! Maleable y dúctil.', 1);

  function checkDone() {
    if (testedModes.has('metal') && testedModes.has('ionic')) {

      if (star('met-2-compare')) sayPool(WIN, 1);

        explained = true;

      + '<div class="bt"><button class="go" id="h2Btn">🔨 Dar martillazo</button><button id="r2Btn">↺ Reiniciar bloque</button></div>'

      say(mode === 'metal' ? 'Bloque metálico listo: golpea para deslizar las capas.' : 'Cristal iónico de comparación: golpea para ver la fractura frágil.', 1);

    $('#h2Btn').onclick = strike;
    $('#r2Btn').onclick = () => { slipStep = 0; targetStep = 0; ionicComp.reset(); say('Bloque reiniciado.', 1); };
    $('#vSea').onchange = e => { showSea = e.target.checked; };

      'Con fuerza ≥ 45 %, pulsa «Dar martillazo» sobre el bloque metálico.',

    cx.fillText(`Bloque metálico · Desplazamiento: ${targetStep} escalón(es)`, titleX(), 26);
    cx.fillStyle = '#9fb0d8'; cx.font = `11px ${FN}`;
    cx.fillText('El mar de electrones se adapta a la nueva geometría sin romper la unión metálica.', 18, 405, 666);

  return {

        ok: 0, key: 'met-2-predict',

        bad: 'Casi… 🤔 Piensa en qué mantiene unidos a los cationes positivos cuando se desplazan.',

};

/* ===== Metálico 3: aleaciones ===== */
SC['met-3'] = sd => {
  const FN = '"Trebuchet MS",system-ui,sans-serif';
  const TYPES = [
    { id: 'pure', n: 'Metal puro (Fe)', crit: 35, desc: 'Capas regulares: los planos atómicos deslizan con facilidad.' },
    { id: 'subst', n: 'Sustitucional (Latón Cu+Zn)', crit: 70, desc: 'Átomos de distinto radio sustituyen nodos y distorsionan la red.' },
    { id: 'inter', n: 'Intersticial (Acero Fe+C)', crit: 85, desc: 'Átomos pequeños (C) ocupan huecos intersticiales y bloquean el deslizamiento.' }

    if (tested.has('subst') && tested.has('inter')) {
      flash(2);
      if (star('met-3-alloy')) sayPool(WIN, 1);

    if (tested.has('pure') && (tested.has('subst') || tested.has('inter'))) {

  function buildControls() {

      + `<div class="seg" id="kSel">${TYPES.map(t => `<button data-k="${t.id}" class="${t.id === kind ? 'on' : ''}">${t.n}</button>`).join('')}</div>`
      + `<label>Esfuerzo de corte aplicado <b id="vs3">${stress} %</b><input type="range" id="S3" min="20" max="100" step="5" value="${stress}" aria-label="Esfuerzo de corte"></label>`
      + '<div class="bt"><button class="go" id="sh3Btn">↔️ Aplicar esfuerzo</button></div>'
      + '<div class="mt" id="a3Stat"></div>';

    $('#kSel').onclick = e => {
      const b = e.target.closest('button'); if (!b) return;
      kind = b.dataset.k; slip = 0;
      $('#kSel').querySelectorAll('button').forEach(x => x.classList.toggle('on', x.dataset.k === kind));
      say(kObj().desc, 1); syncUI();
    };
    $('#S3').oninput = e => { stress = +e.target.value; $('#vs3').textContent = `${stress} %`; syncUI(); };
    $('#sh3Btn').onclick = applyShear;
    vw.append(hintBtn([
      'Pon un esfuerzo intermedio (por ejemplo 55 %) y aplícalo primero al metal puro: verás que desliza.',

      'Prueba las tres muestras para desbloquear la explicación final.'
    ]).el);
    syncUI();
  }

  function syncUI() {
    const st = $('#a3Stat'); if (!st) return;
    const k = kObj();
    st.innerHTML = `<div><b>${k.n}</b> · Umbral de deslizamiento: <b>${k.crit} %</b></div>`
      + `<div class="mu">${k.desc}</div>`
      + `<div class="mu">Nota: las propiedades reales dependen de la composición exacta y del tratamiento térmico (no hay una receta universal).</div>`;
  }

  function update(dt) {
    if (slip > 0 && slip < 0.5) slip = Math.max(0, slip - dt * 1.5);

  function draw() {
    bg();
    const cols = 9, rows = 5, sp = 42, ox = 165, oy = 135;
    const shiftTop = slip >= 0.5 ? 28 : slip * 18;

    cx.fillStyle = 'rgba(34, 211, 238, 0.14)';
    cx.beginPath(); cx.roundRect(ox - 28, oy - 28, (cols - 1) * sp + 68, (rows - 1) * sp + 56, 14); cx.fill();

    const substSet = new Set(['1,2', '2,5', '3,3', '1,6']);
    for (let r = 0; r < rows; r++) for (let c = 0; c < cols; c++) {
      const isSub = kind === 'subst' && substSet.has(`${r},${c}`);
      const dx = r < 2 ? shiftTop : 0;
      const distY = isSub ? (r % 2 === 0 ? -4 : 4) : 0;

/* ===== Metálico 5: teoría de bandas (solo Bachillerato) ===== */
SC['met-5'] = sd => {
  const FN = '"Trebuchet MS",system-ui,sans-serif';
  const OKSH = ['¡Libre!!', '¡Yupiii!!', '¡Vivaaa!!', '¡Ahí vooooy!'], NOSH = ['¡Mosquis!!', '¡Aich!!', '¡Cáspita!', '¡Lechuguitas!'], pickSh = a => a[Math.floor(rnd() * a.length)];

      res: 'Metal: conduce, no hay gap', val: 'Banda 3s, semillena (solo la mitad de los niveles está ocupada)', con: 'La misma banda 3s: justo encima de los electrones hay niveles vacíos', gp: 'Sin gap',
      bands: [mkBand('3s', 92, 330, 150, 330, .5, 'both', 'Banda 3s: valencia y conducción a la vez', 'below')] },

    { id: 'si', btn: 'Si', name: 'Silicio (Si)', cfg: 'Semiconductor', gap: 1.1, kind: 's',
      res: 'Semiconductor: conduce si E ≥ 1,1 eV', val: 'Llena: orbitales enlazantes (híbridos sp³ de los enlaces Si–Si)', con: 'Vacía: orbitales antienlazantes (sp³*), 1,1 eV por encima', gp: '1,1 eV: pequeño',
      bands: [mkBand('V', 92, 330, VTOP, VBOT, 1, 'valence', 'Banda de valencia (llena)', 'below'), mkBand('C', 92, 330, gy(1.1) - 66, gy(1.1), 0, 'cond', 'Banda de conducción (vacía)', 'above')] },
    { id: 'c', btn: 'Diamante', name: 'Diamante (C)', cfg: 'Aislante', gap: 5.5, kind: 'i',
      res: 'Aislante: no hay electrones que se muevan', val: 'Llena: orbitales enlazantes (híbridos sp³ de los enlaces C–C)', con: 'Vacía: orbitales antienlazantes (sp³*), 5,5 eV por encima', gp: '5,5 eV: enorme',
      bands: [mkBand('V', 92, 330, VTOP, VBOT, 1, 'valence', 'Banda de valencia (llena)', 'below'), mkBand('C', 92, 330, gy(5.5) - 66, gy(5.5), 0, 'cond', 'Banda de conducción (vacía)', 'above')] }
  ];
  MATS[0].ef = MATS[0].bands[0].ft; MATS[1].ef = 238;

  let mi = 0, eV = 0.8, volt = false, clk = 0, auto = 0, gen = 0, gl = 0, phot = null, explained = false, gapOk = false, gapFail = false;
  const seen = new Set(), vw = document.createElement('div');

  function build() {
    els = []; rings = []; shouts = []; phot = null;

    cx.strokeStyle = pol ? '#fde047' : '#22d3ee'; cx.lineWidth = 2; cx.stroke();
    if (dots) {
      cx.fillStyle = '#fde047';
      for (let k = 0; k < 10; k++) {
        const a = (RM ? 0 : t) * (1.2 + (k % 3) * 0.35) * (k % 2 ? 1 : -1) + k * 0.63;
        cx.beginPath();
        cx.arc(sx + mag * 0.45 + Math.cos(a) * (rx - 7) * 0.8, Math.sin(a) * (ry - 5) * 0.8, 2.2, 0, TAU);
        cx.fill();
      }
    }
    cx.restore();

    cx.fillStyle = '#0f1730'; cx.strokeStyle = '#94a3b8'; cx.lineWidth = 2;
    cx.beginPath(); cx.arc(x, y, 12, 0, TAU); cx.fill(); cx.stroke();
    cx.fillStyle = '#e8eeff'; cx.font = `bold 11px ${FN}`; cx.textAlign = 'center'; cx.fillText(label, x, y + 4);

    if (pol) {
      const horiz = Math.abs(co) > 0.6;
      cx.font = `bold 13px ${FN}`;
      for (const sg of [1, -1]) {
        let px, py;
        if (horiz) { px = x + co * (sx + sg * rx * 0.55); py = y + si * sx - vext - 8; }
        else { const al = sx + sg * (rx + 12); px = x + co * al; py = y + si * al + 4; }
        cx.fillStyle = sg > 0 ? '#fde047' : '#7dd3fc';
        cx.fillText(sg > 0 ? 'δ−' : 'δ+', px, py);
      }
    } else if (!quietCloud) {
      cx.fillStyle = '#9fb0d8'; cx.font = `11px ${FN}`; cx.fillText('Sin dipolo (simétrica)', x, y - (r + 16));
    }
    cx.fillStyle = '#9fb0d8'; cx.font = `11px ${FN}`; cx.fillText(subTag, x + tx, y + r + 20 + mag * 0.45);
  }

  function update(dt) {
    const t = (anim.t += dt), k = 1 - Math.exp(-4.5 * dt), prox = proxOf(), al = alignOf(), g = geo(), wob = RM ? 0 : 1;

    // 1) Dipolos permanentes: lejos giran libremente; cerca se orientan (δ− frente a δ+)
    const ka = 1 - Math.exp(-5 * al * dt);
    const f1 = wob * (0.55 + 0.9 * Math.sin(t * 0.8 + w1) + 0.6 * Math.sin(t * 1.9 + 2 * w1));
    const f2 = wob * (-0.55 + 0.9 * Math.sin(t * 0.7 + w2) + 0.6 * Math.sin(t * 2.1 + 2 * w2));
    anim.a1 = lerpA(anim.a1 + f1 * (1 - al) * dt, g.phi, ka);
    anim.a2 = lerpA(anim.a2 + f2 * (1 - al) * dt, g.phi + (ddAligned ? 0 : Math.PI), ka);
    if (vdwType === 'dd' && !ddAligned && al > 0.5) {
      anim.misT += dt;
      if (anim.misT > 2.6) {
        ddAligned = true; anim.misT = 0; renderSubControls(); syncUI();
        say('La molécula de la derecha ha girado sola: ahora δ− ··· δ+ y la atracción vuelve.', 1);
      }
    } else anim.misT = 0;

    // 2) Dipolo permanente - dipolo inducido: el HCl se orienta hacia el Ar y la nube del Ar se deforma solo si está cerca
    anim.h = lerpA(anim.h, g.phi + (diFlip ? Math.PI : 0), k);
    anim.ind += (Math.cos(anim.h - g.phi) * prox * 18 - anim.ind) * k;

    // 3) London: dipolos instantáneos al azar que rotan suavemente; cerca se alinean y se sincronizan
    for (const f of anim.fl) {
      f.age += dt; f.next -= dt;
      if (f.next <= 0) { f.age = 0; f.th = rnd() * TAU; f.next = 1.5 + rnd() * 0.5; }
    }
    anim.th1 += wob * (0.7 + 1.0 * Math.sin(t * 0.9 + w1) + 0.7 * Math.sin(t * 1.7 + 2.3 * w1)) * dt;
    anim.th2 += wob * (-0.8 + 1.0 * Math.sin(t * 1.1 + w2) + 0.7 * Math.sin(t * 1.5 + 2.3 * w2)) * dt;
    anim.osc = RM ? 0.8 : Math.sin(t * 3.4);
    anim.sync += (al - anim.sync) * k;

    anim.ui += dt;
    if (anim.ui > 0.15) { anim.ui = 0; syncUI(); }
  }

  function draw() {
    bg();
    const t = anim.t, wob = RM ? 0 : 1, prox = proxOf(), al = alignOf();
    const p1 = { x: pos[0].x + wob * 4 * Math.sin(t * 0.9), y: pos[0].y + wob * 3 * Math.sin(t * 1.3 + 1) };
    const p2 = { x: pos[1].x + wob * 4 * Math.sin(t * 1.1 + 2), y: pos[1].y + wob * 3 * Math.sin(t * 0.8 + 3) };
    anim.sp[0] = p1; anim.sp[1] = p2;
    const ddx = p2.x - p1.x, ddy = p2.y - p1.y, dd = Math.hypot(ddx, ddy) || 1, ex = ddx / dd, ey = ddy / dd, phi = Math.atan2(ddy, ddx);
    const lxo = sep < 170 ? 38 : 0;
    const midX = Math.max(190, Math.min(510, (p1.x + p2.x) / 2));

    // Cabecera agrupadora de Fuerzas de van der Waals
    cx.fillStyle = 'rgba(15, 23, 48, 0.85)'; cx.strokeStyle = '#7c3aed'; cx.lineWidth = 1.5;
    cx.beginPath(); cx.roundRect(18, 44, 664, 46, 10); cx.fill(); cx.stroke();
    cx.textAlign = 'left'; cx.fillStyle = '#fde047'; cx.font = `bold 13px ${FN}`;
    cx.fillText(`FUERZAS DE VAN DER WAALS → ${modeObj().title}`, 30, 63);
    cx.fillStyle = '#cbd5e1'; cx.font = `11.5px ${FN}`;
    cx.fillText(modeObj().sub, 30, 81, 640);

    if (vdwType === 'dd') {
      // Dos dipolos permanentes (HCl ... HCl): lejos giran libres; cerca se orientan con polos opuestos enfrentados
      const a1 = anim.a1 + wob * 0.06 * Math.sin(t * 1.7), a2 = anim.a2 + wob * 0.06 * Math.sin(t * 1.5 + 1);
      drawPolarHCl(p1.x, p1.y, a1, 'Dipolo permanente 1 (HCl)', -lxo);
      drawPolarHCl(p2.x, p2.y, a2, 'Dipolo permanente 2 (HCl)', lxo);

      const fav = Math.cos(a1 - phi) * Math.cos(a2 - phi), w = 1.2 + prox * 6.5 * Math.max(0.25, Math.abs(fav));
      const col = al < 0.3 ? '#64748b' : fav > 0.3 ? '#34d399' : fav < -0.3 ? '#f87171' : '#fbbf24';
      cx.save();
      cx.setLineDash([5, 5]);
      cx.strokeStyle = col;
      cx.lineWidth = w;
      cx.beginPath(); cx.moveTo(p1.x + ex * 38, p1.y + ey * 38); cx.lineTo(p2.x - ex * 38, p2.y - ey * 38); cx.stroke();
      cx.restore();

      cx.fillStyle = col;
      cx.font = `bold 13px ${FN}`; cx.textAlign = 'center';
      const txt = al < 0.3 ? 'Muy separadas: los dipolos giran libres, casi sin atracción' : fav > 0.3 ? 'Atracción entre dipolos permanentes (δ− ··· δ+)' : fav < -0.3 ? 'Repulsión (δ− ··· δ−) → la molécula tiende a girar' : 'Girando para orientarse…';
      cx.fillText(txt, midX, Math.max(114, Math.min(p1.y, p2.y) - 66));
    } else if (vdwType === 'di') {
      // Dipolo permanente (HCl) induciendo un dipolo en una molécula apolar (Ar): la nube electrónica se desplaza de forma gradual
      drawPolarHCl(p1.x, p1.y, anim.h + wob * 0.1 * Math.sin(t * 1.6), 'Dipolo permanente (HCl)', -lxo);
      const fAr = anim.fl[1], eAr = RM ? 0 : (fAr.age < 0.4 ? Math.sin(Math.PI * fAr.age / 0.4) : 0);
      const spon = 8 * eAr * Math.max(0, 1 - Math.abs(anim.ind) / 1.5);   // solo cuando no está inducido por el HCl
      drawCloud(p2.x, p2.y, 32, ex * anim.ind + Math.cos(fAr.th) * spon, ey * anim.ind + Math.sin(fAr.th) * spon, 'Ar', Math.abs(anim.ind) > 1.5 ? 'Dipolo inducido en apolar' : 'Molécula apolar', true, lxo);

      if (prox > 0.12 && Math.abs(anim.ind) > 1.5) {
        cx.save();
        cx.setLineDash([4, 4]);
        cx.strokeStyle = '#fde047';
        cx.lineWidth = 1.5 + prox * 6;
        cx.beginPath(); cx.moveTo(p1.x + ex * 38, p1.y + ey * 38); cx.lineTo(p2.x - ex * 34, p2.y - ey * 34); cx.stroke();
        cx.restore();
        cx.fillStyle = '#fde047'; cx.font = `bold 13px ${FN}`; cx.textAlign = 'center';
        cx.fillText(anim.ind < 0 ? 'Atracción δ+ (permanente) ··· δ− (inducido)' : 'Atracción δ− (permanente) ··· δ+ (inducido)', midX, Math.max(114, Math.min(p1.y, p2.y) - 66));
      }
    } else {
      // Dos moléculas apolares: dipolos instantáneos al azar lejos; cerca se alinean y sincronizan (dispersión de London)
      const m = mObj(), s = anim.sync, osc = anim.osc;
      const A = (6 + m.e * 0.12) * (0.4 + 0.6 * prox);
      // Sin sincronía: sin dipolo casi siempre; cada 1,5–2 s aparece uno espontáneo que dura 0,4 s
      const env = f => (RM ? 0 : f.age < 0.4 ? Math.sin(Math.PI * f.age / 0.4) : 0);
      const [f1, f2] = anim.fl, e1 = env(f1), e2 = env(f2);
      const d1x = A * ((1 - s) * e1 * Math.cos(f1.th) + s * ex * osc), d1y = A * ((1 - s) * e1 * Math.sin(f1.th) + s * ey * osc);
      const d2x = A * ((1 - s) * e2 * Math.cos(f2.th) + s * ex * osc), d2y = A * ((1 - s) * e2 * Math.sin(f2.th) + s * ey * osc);
      quietCloud = true;
      drawCloud(p1.x, p1.y, m.r, d1x, d1y, m.f, 'Apolar 1 (dipolo instantáneo)', false);
      drawCloud(p2.x, p2.y, m.r, d2x, d2y, m.f, s > 0.6 ? 'Apolar 2 (dipolo inducido)' : 'Apolar 2 (dipolo instantáneo)', false);
      quietCloud = false;

      const w = 1 + (m.e / 106) * prox * 7 * (0.3 + 0.7 * s);
      cx.save();
      cx.globalAlpha = 0.3 + 0.7 * s;
      cx.setLineDash([4, 4]);
      cx.strokeStyle = '#22d3ee';
      cx.lineWidth = w;
      cx.beginPath(); cx.moveTo(p1.x + ex * (m.r + 6), p1.y + ey * (m.r + 6)); cx.lineTo(p2.x - ex * (m.r + 6), p2.y - ey * (m.r + 6)); cx.stroke();
      cx.restore();

      cx.fillStyle = s > 0.6 ? '#22d3ee' : '#94a3b8'; cx.font = `bold 13px ${FN}`; cx.textAlign = 'center';
      const txt = s > 0.6 ? 'Atracción de dispersión de London (fluctuación sincronizada)' : s < 0.25 ? 'Lejos: dipolos instantáneos al azar, sin sincronía' : 'Los dipolos se alinean y se sincronizan…';
      cx.fillText(txt, midX, Math.max(112, Math.min(p1.y, p2.y) - m.r - 40));
    }

    cx.textAlign = 'right'; cx.fillStyle = '#9fb0d8'; cx.font = `11px ${FN}`;
    cx.fillText('✋ Arrastra las moléculas para acercarlas o alejarlas', 682, 108);

    cx.textAlign = 'left'; cx.fillStyle = '#e8eeff'; cx.font = `bold 14px ${FN}`;
    cx.fillText(`Fuerzas de van der Waals · Separación = ${Math.round(sep)} px`, titleX(), 26);
    cx.fillStyle = '#9fb0d8'; cx.font = `11px ${FN}`;
    cx.fillText('Agrupadas bajo «Fuerzas de van der Waals»: 1) dipolos permanentes, 2) dipolo permanente - dipolo inducido y 3) dispersión de London.', 18, 405, 666);
  }

  function bindDrag() {
    cv.style.touchAction = 'none';
    on(cv, 'pointerdown', e => {
      const p = lc(e); let best = -1, bd = 1e9;
      for (let i = 0; i < 2; i++) {
        const d = Math.hypot(anim.sp[i].x - p.x, anim.sp[i].y - p.y);
        if (d <= hitR() && d < bd) { bd = d; best = i; }
      }
      if (best < 0) return;
      dragI = best; dragOff.x = pos[best].x - p.x; dragOff.y = pos[best].y - p.y;
      cv.setPointerCapture(e.pointerId); cv.style.cursor = 'grabbing'; e.preventDefault();
    });
    on(cv, 'pointermove', e => {
      const p = lc(e);
      if (dragI < 0) {
        cv.style.cursor = anim.sp.some(s => Math.hypot(s.x - p.x, s.y - p.y) <= hitR()) ? 'grab' : 'default';
        return;
      }
      const o = pos[1 - dragI], q = pos[dragI];
      let nx = clampX(p.x + dragOff.x), ny = clampY(p.y + dragOff.y);
      const dx = nx - o.x, dy = ny - o.y, d = Math.hypot(dx, dy);
      if (d < SEP_MIN) {
        const ux = d > 0.5 ? dx / d : (dragI ? 1 : -1), uy = d > 0.5 ? dy / d : 0;
        nx = clampX(o.x + ux * SEP_MIN); ny = clampY(o.y + uy * SEP_MIN);
      }
      q.x = nx; q.y = ny;
      sep = geo().d;
      syncSepUI(); checkProgress(); syncUI();
    });
    const up = () => { if (dragI < 0) return; dragI = -1; cv.style.cursor = 'grab'; };
    on(cv, 'pointerup', up); on(cv, 'pointercancel', up);
  }

  return {
    mount() {
      if (LV === 'eso') ask({
        ph: 'Predice:', q: '¿Qué crees que pasa con la atracción entre dos moléculas polares cuando las alejas?',
        o: ['Casi desaparece', 'Se hace más fuerte', 'No cambia'], ok: 0, key: 'im-2-predict',
        good: '¡Bien! La atracción es débil y solo se nota cuando las moléculas están cerca.', bad: 'Casi… 🤔 Piensa en cuánto se notan estas fuerzas cuando las moléculas están lejos.', done: () => { }
      }); else ask({
        ph: 'Predice:', q: '¿Qué ocurre cuando una molécula polar (dipolo permanente) se acerca a una molécula apolar?',
        o: [
          'El campo del dipolo permanente deforma su nube electrónica e induce un dipolo opuesto, generando atracción',
          'No ocurre ninguna interacción porque la molécula apolar tiene carga neta cero',
          'Se transfieren todos los protones de una molécula a otra'
        ],
        ok: 0, key: 'im-2-predict',
        good: '¡Bien! Esa interacción dipolo permanente - dipolo inducido forma parte de las fuerzas de van der Waals.',
        bad: 'Casi… 🤔 Piensa en cómo afecta un extremo δ− o δ+ a la nube de electrones de una molécula vecina.',
        done: () => { }
      });
      $('#mis').append(vw);
      buildControls();
      bindDrag();
    },
    update, draw, teardown() {}
  };
};

/* ===== Intermolecular 3: puentes de hidrógeno estrictamente O···H y H···O ===== */
SC['im-3'] = sd => {
  const FN = '"Trebuchet MS",system-ui,sans-serif';
  let predicted = true, phase = 'liquid', showHB = true, explained = false, tt = 0;
  const liqMols = [], iceMols = [], iceEdges = [], vw = document.createElement('div');

  function waterAtoms(m) {
    const o = { x: m.x, y: m.y };
    const h1 = { x: m.x + Math.cos(m.ang - 0.9) * 11, y: m.y + Math.sin(m.ang - 0.9) * 11 };
    const h2 = { x: m.x + Math.cos(m.ang + 0.9) * 11, y: m.y + Math.sin(m.ang + 0.9) * 11 };
    return { o, h1, h2 };
  }

  // Agua líquida (24 moléculas desordenadas pero densas)
  for (let i = 0; i < 24; i++) {
    liqMols.push({
      x: 90 + (i % 6) * 52 + (rnd() - 0.5) * 20,
      y: 95 + Math.floor(i / 6) * 58 + (rnd() - 0.5) * 20,
      vx: (rnd() - 0.5) * 24, vy: (rnd() - 0.5) * 24,
      ang: rnd() * 6.283, om: (rnd() - 0.5) * 0.9
    });
  }

  // Hielo (red hexagonal abierta bipartita donde cada puente de hidrógeno va exactamente de un H a un O vecino)
  const R_HEX = 55;
  const hexCenters = [[165, 175], [275, 175], [220, 175 + R_HEX * Math.sqrt(3)]];
  const seenNodes = new Map();
  for (const [hx, hy] of hexCenters) {
    for (let k = 0; k < 6; k++) {
      const a = k * Math.PI / 3;
      const vx = +(hx + Math.cos(a) * R_HEX).toFixed(1), vy = +(hy + Math.sin(a) * R_HEX).toFixed(1);
      const key = `${Math.round(vx)},${Math.round(vy)}`;
      if (!seenNodes.has(key)) {
        const idx = iceMols.length;
        seenNodes.set(key, idx);
        iceMols.push({ x: vx, y: vy, ang: 0, out: [], p1: rnd() * 6.283, p2: rnd() * 6.283, p3: rnd() * 6.283, p4: rnd() * 6.283, p5: rnd() * 6.283 });
      }
    }
  }
  // Detectar aristas hexagonales (distancia ≈ R_HEX) y orientarlas dirigidas (donor -> acceptor) con grado de salida <= 2
  const degOut = new Array(iceMols.length).fill(0);
  for (let i = 0; i < iceMols.length; i++) {
    for (let j = i + 1; j < iceMols.length; j++) {
      const d = Math.hypot(iceMols[j].x - iceMols[i].x, iceMols[j].y - iceMols[i].y);
      if (Math.abs(d - R_HEX) < 3) {
        // Preferimos orientar de arriba/izquierda hacia abajo/derecha; cada vértice de red hexagonal tiene grado <= 3
        let from = i, to = j;
        if (degOut[from] >= 2) { from = j; to = i; }
        degOut[from]++;
        const th = Math.atan2(iceMols[to].y - iceMols[from].y, iceMols[to].x - iceMols[from].x);
        iceMols[from].out.push({ to, th });
        iceEdges.push({ from, to, hSlot: iceMols[from].out.length - 1 });
      }
    }
  }
  // Ajustar el ángulo de cada molécula de hielo para que sus H apunten exactamente a los O aceptores
  for (const m of iceMols) {
    if (m.out.length === 2) {
      const t1 = m.out[0].th, t2 = m.out[1].th;
      // Ordenar para que H1 (ang - 0.9) apunte a t1 y H2 (ang + 0.9) apunte a t2
      const diff = Math.atan2(Math.sin(t2 - t1), Math.cos(t2 - t1));
      if (diff < 0) {
        const tmp = m.out[0]; m.out[0] = m.out[1]; m.out[1] = tmp;
        iceEdges.forEach(e => { if (e.from === iceMols.indexOf(m)) e.hSlot = 1 - e.hSlot; });
      }
      m.ang = Math.atan2(Math.sin(m.out[0].th) + Math.sin(m.out[1].th), Math.cos(m.out[0].th) + Math.cos(m.out[1].th));
    } else if (m.out.length === 1) {
      m.ang = m.out[0].th + 0.9; // H1 en ang - 0.9 = th apunta directo al O vecino
    } else {
      m.ang = -Math.PI / 2;
    }
  }

  function setPhase(p) {
    phase = p;
    flash(p === 'ice' ? 1 : 0);
    if (p === 'ice') {
      flash(2); flash(3);
      if (star('im-3-ice')) sayPool(WIN, 1);
      if (!explained) {
        explained = true;
        ask({
          into: vw, ph: 'Explica:', q: '¿Por qué el hielo ocupa más volumen y flota sobre el agua líquida?',
          o: ['Porque los enlaces de hidrógeno O···H ordenan las moléculas en una red hexagonal abierta con huecos', 'Porque las moléculas de agua se hacen más pesadas al enfriarse', 'Porque el hielo pierde todos sus enlaces de hidrógeno'],
          ok: 0, key: 'im-3-float',
          good: '¡Exacto! 🎉 Esa red cristalina abierta tiene menor densidad que el líquido desordenado, por eso el hielo flota.',
          bad: 'Compara el espacio vacío en el centro de los hexágonos del hielo frente al líquido compacto.'
        });
      }
    }
    syncUI();
  }

  function buildControls() {
    vw.innerHTML = '<p><b>Prueba:</b> alterna entre agua líquida y hielo para observar los enlaces de hidrógeno <b>O···H</b> y el cambio de densidad.</p>'
      + '<div class="seg" id="phSel"><button data-p="liquid" class="on">💧 Agua líquida (4 °C)</button><button data-p="ice">🧊 Hielo (0 °C)</button></div>'
      + `<label class="lk"><input type="checkbox" id="vHB" ${showHB ? 'checked' : ''}> Mostrar puentes de hidrógeno (O···H)</label>`
      + '<div class="mt" id="im3Stat"></div>';

    $('#phSel').onclick = e => {
      const b = e.target.closest('button'); if (!b) return;
      $('#phSel').querySelectorAll('button').forEach(x => x.classList.toggle('on', x.dataset.p === b.dataset.p));
      setPhase(b.dataset.p);
    };
    $('#vHB').onchange = e => { showHB = e.target.checked; };
    vw.append(hintBtn([
      'En agua líquida verás puentes de hidrógeno O···H que se forman y rompen continuamente.',
      'Pulsa «Hielo (0 °C)» para congelar la red y ver la estructura hexagonal abierta.',
      'Observa cómo cada línea discontinua une directamente un H (blanco) con un O (rojo).'
    ]).el);
    syncUI();
  }

  function syncUI() {
    const st = $('#im3Stat'); if (!st) return;
    const isIce = phase === 'ice';
    st.innerHTML = `<div>Estado: <b>${isIce ? 'Hielo (red hexagonal abierta)' : 'Agua líquida (desordenada y compacta)'}</b></div>`
      + `<div>Densidad: <b>${isIce ? '0,92 g/cm³ (flota)' : '1,00 g/cm³ (máxima a 4 °C)'}</b></div>`
      + `<div class="mu">${isIce ? 'Puentes O···H fijos: 4 por molécula en 3D (en este plano hexagonal se ven los enlaces del anillo).' : 'Puentes O···H transitorios: se forman y rompen con la agitación térmica.'}</div>`;
  }

  function update(dt) {
    tt += dt;
    if (phase !== 'liquid') return;
    for (const m of liqMols) {
      m.x += m.vx * dt; m.y += m.vy * dt; m.ang += m.om * dt;
      if (m.x < 75) { m.x = 75; m.vx = Math.abs(m.vx); }
      if (m.x > 375) { m.x = 375; m.vx = -Math.abs(m.vx); }
      if (m.y < 80) { m.y = 80; m.vy = Math.abs(m.vy); }
      if (m.y > 350) { m.y = 350; m.vy = -Math.abs(m.vy); }
    }
    // Suave orientación dipolar transitoria para favorecer alineaciones O···H realistas
    for (let i = 0; i < liqMols.length; i++) {
      for (let j = i + 1; j < liqMols.length; j++) {
        const a = liqMols[i], b = liqMols[j];

    { id: 'S7', name: 'Muestra G (lámina negra opaca)', fam: 'Covalente reticular', tm: '> 3600 °C (sublima)', condS: 'Sí conduce (en capas)', condL: '—', solW: 'Insoluble', mech: 'Exfoliable (blando entre capas)', hint: 'Grafito (C)' },
    { id: 'S8', name: 'Muestra H (metal plateado ligero)', fam: 'Metálico', tm: '660 °C (moderado-alto)', condS: 'Sí conduce', condL: 'Sí conduce', solW: 'Insoluble', mech: 'Maleable y dúctil', hint: 'Aluminio (Al)' },
    { id: 'S9', name: 'Muestra I (líquido incoloro a 25 °C)', fam: 'Enlace de hidrógeno dominante', tm: '0 °C (Teb = 100 °C)', condS: 'No conduce (puro)', condL: 'Muy baja (puro)', solW: 'Miscible', mech: 'Líquido con alta tensión superficial', hint: 'Agua destilada (H₂O)' },
    { id: 'S10', name: 'Muestra J (sólido ceroso apolar)', fam: 'Covalente molecular', tm: '58 °C (bajo)', condS: 'No conduce', condL: 'No conduce', solW: 'Insoluble (flota)', mech: 'Blando / deformable', hint: 'Parafina (alcano)' }
  ];
  const TESTS = [
    { id: 'tm', n: '🌡️ Punto de fusión' },
    { id: 'condS', n: '🔋 Conductividad sólido' },
    { id: 'condL', n: '🔥 Conductividad fundido' },
    { id: 'solW', n: '💧 Solubilidad en agua' },
    { id: 'mech', n: '🔨 Ensayo mecánico' }
  ];

  let predicted = true, sIdx = 0, solvedCount = 0;
  const revealed = {}, solvedMap = {}, vw = document.createElement('div');
  const curS = () => SUBSTANCES[sIdx];
  const getRev = id => revealed[id] || (revealed[id] = new Set());

  function runTest(tid) {
    const s = curS();
    getRev(s.id).add(tid);
    flash(0); flash(3);
    say(`Prueba realizada (${TESTS.find(t => t.id === tid).n}): observa la libreta de resultados.`, 1);
    syncUI();
  }

  function guessFamily(fam) {
    const s = curS();
    if (fam !== s.fam) {
      sayPool(ERR, 1);
      return;
    }
    if (!solvedMap[s.id]) {
      solvedMap[s.id] = true;
      solvedCount++;
      if (solvedCount >= 1 && star('lab-1-solve1')) sayPool(WIN, 1);
      if (solvedCount >= 3 && star('lab-1-solve3')) sayPool(WIN, 1);
    }
    say(`¡Correcto! ${s.name} pertenece a «${s.fam}» (${s.hint}).`, 1);
    syncUI();
  }

  function buildControls() {
    vw.innerHTML = '<p><b>Prueba:</b> elige una muestra misteriosa, realiza ensayos en el banco y clasifica su tipo de enlace o interacción dominante.</p>'
      + `<div class="seg" id="labSel">${SUBSTANCES.map((s, i) => `<button data-i="${i}" class="${i === sIdx ? 'on' : ''}">${s.id}</button>`).join('')}</div>`
      + `<div class="bt" id="tBtns">${TESTS.map(t => `<button data-t="${t.id}">${t.n}</button>`).join('')}</div>`
      + '<p><b>3 · Clasifica la muestra:</b></p>'
      + `<div class="bt" id="fBtns">${FAMILIES.map(f => `<button class="opt" data-f="${f}">${f}</button>`).join('')}</div>`
      + '<div class="mt" id="labStat"></div>';

    $('#labSel').onclick = e => {
      const b = e.target.closest('button'); if (!b) return;
      sIdx = +b.dataset.i;
      $('#labSel').querySelectorAll('button').forEach((x, j) => x.classList.toggle('on', j === sIdx));
      syncUI();
    };
    $('#tBtns').onclick = e => {
      const b = e.target.closest('button'); if (!b) return;
      runTest(b.dataset.t);
    };
    $('#fBtns').onclick = e => {
      const b = e.target.closest('button'); if (!b) return;
      guessFamily(b.dataset.f);
    };
    vw.append(hintBtn([
      'No te precipites con una sola prueba: por ejemplo, tanto un sólido iónico como un covalente reticular son aislantes en estado sólido.',
      'La conductividad fundido o disuelto distingue un compuesto iónico de uno covalente reticular o molecular.',
      'Resuelve al menos 3 muestras distintas para ganar todas las estrellas del laboratorio.'
    ]).el);
    syncUI();
  }

  function syncUI() {
    const st = $('#labStat'); if (!st) return;
    const s = curS(), r = getRev(s.id);
    st.innerHTML = `<div><b>${s.name}</b> · Resueltas: <b>${solvedCount}/10</b> ${solvedMap[s.id] ? '✅ (' + s.fam + ')' : ''}</div>`
      + `<table><tr><th>Ensayo</th><th>Resultado</th></tr>`
      + TESTS.map(t => `<tr><td>${t.n}</td><td>${r.has(t.id) ? '<b>' + s[t.id] + '</b>' : '— (sin probar)'}</td></tr>`).join('')
      + `</table>`;
  }

  function draw() {
    bg();
    const s = curS(), r = getRev(s.id);
    cx.fillStyle = 'rgba(15, 23, 48, 0.85)'; cx.strokeStyle = '#7c3aed'; cx.lineWidth = 2;
    cx.beginPath(); cx.roundRect(45, 58, 250, 305, 14); cx.fill(); cx.stroke();
    cx.fillStyle = '#e8eeff'; cx.font = `bold 15px ${FN}`; cx.textAlign = 'center';
    cx.fillText(s.name, 170, 88);

    cx.fillStyle = solvedMap[s.id] ? '#34d399' : '#22d3ee';
    cx.beginPath(); cx.arc(170, 185, 48, 0, 6.283); cx.fill();
    cx.fillStyle = '#060a18'; cx.font = `bold 24px ${FN}`;
    cx.fillText(solvedMap[s.id] ? '✓' : '?', 170, 193);

    cx.fillStyle = '#9fb0d8'; cx.font = `12px ${FN}`;
    cx.fillText(solvedMap[s.id] ? `Identificada: ${s.hint}` : `Pruebas realizadas: ${r.size}/5`, 170, 265);
    cx.fillText(`Muestras resueltas: ${solvedCount}/10`, 170, 288);

    cx.fillStyle = 'rgba(6, 10, 24, 0.85)'; cx.strokeStyle = '#24305a'; cx.lineWidth = 1.5;
    cx.beginPath(); cx.roundRect(320, 58, 340, 305, 14); cx.fill(); cx.stroke();
    cx.fillStyle = '#fde047'; cx.font = `bold 14px ${FN}`; cx.textAlign = 'left';
    cx.fillText('📓 Libreta de laboratorio', 340, 88);

    TESTS.forEach((t, i) => {
      const y = 126 + i * 44;
      cx.fillStyle = '#9fb0d8'; cx.font = `bold 12px ${FN}`; cx.fillText(t.n + ':', 340, y);
      cx.fillStyle = r.has(t.id) ? '#e8eeff' : '#64748b'; cx.font = `12px ${FN}`;
      cx.fillText(r.has(t.id) ? s[t.id] : 'Sin realizar', 340, y + 17);
    });

    cx.textAlign = 'left'; cx.fillStyle = '#e8eeff'; cx.font = `bold 14px ${FN}`;
    cx.fillText('Laboratorio de identificación · Cruza varias pruebas antes de concluir', titleX(), 26);
    cx.fillStyle = '#9fb0d8'; cx.font = `11px ${FN}`;
    cx.fillText('Tabla cerrada de 10 sustancias ideales: en la realidad existen compuestos intermedios e impurezas.', 18, 405, 666);
  }

  return {
    mount() {
      ask({
        ph: 'Predice:', q: 'Una muestra sólida NO conduce la electricidad, pero al fundirse sí conduce y tiene punto de fusión alto. ¿Qué tipo de enlace predomina?',
        o: ['Enlace iónico', 'Enlace metálico', 'Fuerzas de dispersión de London'],
        ok: 0, key: 'lab-1-predict',
        good: '¡Bien! Aislante en sólido pero conductor al fundirse es la firma clásica de un compuesto iónico.',
        bad: 'Casi… 🤔 Piensa qué sustancia tiene iones fijos en sólido y móviles al fundirse.',
        done: () => { }
      });
      $('#mis').append(vw);
      buildControls();
    },
    update() {}, draw, teardown() {}
  };
};

/* ===== Prácticas en pestañas: panel desplegable (móvil), insignias de estrellas, pista y escenario fijo ===== */
const mq = matchMedia('(max-width:820px)'), canHover = matchMedia('(hover:hover)');
let popen = false, pinned = true, tipTimer = 0, noClick = false;   // escenario fijo activo por defecto (solo afecta a móvil)
const tipEl = $('#tip');
$('.stage').classList.toggle('pin', pinned);
const pinI = $('#pinI');
pinI.onclick = () => { pinned = !pinned; $('.stage').classList.toggle('pin', pinned); pinI.setAttribute('aria-pressed', String(pinned)); };
function setPop(v) {
  popen = !!v;
  $('.main').classList.toggle('popen', popen);
  $('#sel').querySelectorAll('button[data-i]').forEach(b => b.setAttribute('aria-expanded', String(popen && +b.dataset.i === si)));
}
function refreshBadges() {
  const tb = V[tab]; if (!tb) return;
  $('#sel').querySelectorAll('button[data-i]').forEach(b => {
    const i = +b.dataset.i, x = tb.sc[i], bd = b.querySelector('.bdg'); if (!x || !bd) return;
    const n = x.k.filter(k => done[k]).length, tot = x.k.length;
    bd.textContent = !tot || !n ? '' : n === tot ? '⭐' : n + '/' + tot;
    b.setAttribute('aria-label', (SHORT[x.id] || 'Práctica ' + (i + 1)) + ': ' + x.n + (tot && n ? ', ' + n + ' de ' + tot + ' estrellas' : ''));
  });
}
function showTip(b, text) {
  tipEl.textContent = text; tipEl.hidden = false;
  const r = b.getBoundingClientRect(), w = tipEl.offsetWidth, h = tipEl.offsetHeight;
  const x = Math.max(6, Math.min(innerWidth - w - 6, r.left + r.width / 2 - w / 2));
  let y = r.top - h - 8; if (y < 6) y = r.bottom + 8;
  tipEl.style.left = x + 'px'; tipEl.style.top = y + 'px';
}
function hideTip() { clearTimeout(tipTimer); tipEl.hidden = true; }
addEventListener('scroll', hideTip, { passive: true });
function scrollToPanel() {
  requestAnimationFrame(() => {
    const st = $('.stage'), r = $('#ptitle').getBoundingClientRect();
    const stuck = pinned && innerHeight >= 560, off = stuck ? st.offsetHeight + 10 : 8;
    if (r.top >= off && r.top <= innerHeight * 0.6) return;
    const base = stuck ? $('#sel').getBoundingClientRect().top - off : st.getBoundingClientRect().top - 8;
    scrollBy({ top: base, behavior: RM ? 'auto' : 'smooth' });
  });
}

/* ===== Motor principal de pestañas, escenas y bucle ===== */

const HUES = [38, 330, 268, 168, 95, 12];   // ámbar, rosa, lavanda (los de los recuadros), turquesa, verde lima, coral; sin azul
function applyHue(i) { $('.pn').style.setProperty('--h', HUES[i % HUES.length]); }
function go(t, s) {
  if (cur && cur.teardown) cur.teardown();
  clean();
  tab = t; si = s;
  const tb = V[t], sd = tb.sc[s];
  $('#tabs').querySelectorAll('button').forEach((b, i) => b.classList.toggle('on', i === t));
  const sel = $('#sel'); sel.innerHTML = ''; hideTip();
  tb.sc.forEach((x, i) => {
    if (tb.sc.length === 1) return;   // una sola práctica (Laboratorio misterioso): sin botón de pestaña
    const b = document.createElement('button');
    b.type = 'button'; b.dataset.i = i;
    b.setAttribute('role', 'tab'); b.setAttribute('aria-selected', String(i === s));
    b.innerHTML = (SHORT[x.id] || 'Práctica ' + (i + 1)) + '<span class="bdg"></span><span class="chev" aria-hidden="true"></span>';
    b.style.setProperty('--h', HUES[i % HUES.length]);
    if (i === s) b.className = 'on';
    // Pista con el nombre de la práctica: ratón/teclado al pasar o enfocar; en táctil, con una pulsación larga
    b.addEventListener('mouseenter', () => { if (canHover.matches) showTip(b, x.n); });
    b.addEventListener('mouseleave', hideTip);
    b.addEventListener('focus', () => { if (b.matches(':focus-visible')) showTip(b, x.n); });
    b.addEventListener('blur', hideTip);
    b.addEventListener('pointerdown', e => {
      noClick = false; clearTimeout(tipTimer);
      if (e.pointerType === 'mouse') return;
      tipTimer = setTimeout(() => { showTip(b, x.n); noClick = true; setTimeout(hideTip, 2200); }, 450);
    });
    ['pointerup', 'pointercancel', 'pointerleave'].forEach(ev => b.addEventListener(ev, () => clearTimeout(tipTimer)));
    b.onclick = () => {
      hideTip();
      if (noClick) { noClick = false; return; }
      if (mq.matches) {
        if (i === si) { setPop(!popen); if (popen) scrollToPanel(); return; }
        setPop(true); go(t, i); scrollToPanel();
      } else go(t, i);
    };
    sel.append(b);
  });
  applyHue(s);
  $('#ptitle').textContent = sd.n;
  setPop(tb.sc.length === 1 ? true : popen); refreshBadges();   // con una sola práctica el panel va siempre abierto (no hay pestaña que lo despliegue)
  $('#note').textContent = 'Qué se modeliza y qué se omite: ' + tb.note;
  setIdeas(sd.i);
  say(sd.s, 1);
  cur = SC[sd.id](sd);
  cur.mount();
}

function loop(ts) {
  const dt = Math.min(.05, (ts - last) / 1000 || 0); last = ts;
  if (cur) {
    if (cur.update) cur.update(dt);
    cx.setTransform(sc, 0, 0, sc, 0, 0);
    if (cur.draw) cur.draw();
  }
  requestAnimationFrame(loop);
}

let ionPress = 0;   // clave secreta: 5 pulsaciones en Iónico y luego Covalente
function buildTabs() {
  const nav = $('#tabs'); nav.innerHTML = '';
  V.forEach((t, i) => {
    const b = document.createElement('button');
    b.textContent = t.n;
    b.onclick = () => {
      const kind = /^ionic/.test(t.sc[0].id) ? 'ion' : /^cov/.test(t.sc[0].id) ? 'cov' : '';
      if (kind === 'ion') ionPress++;
      else { if (kind === 'cov' && ionPress >= 5) { ionPress = 0; andyShow(); return; } ionPress = 0; }
      setPop(false); go(i, 0);
    };
    nav.append(b);
  });
}
function setLevel(l) {
  if (l === LV) return;
  const curId = V[tab] && V[tab].sc[si] ? V[tab].sc[si].id : null;
  LV = l; _ec.clear(); done = {}; stars = 0; $('#st').textContent = 0;
  buildV(); buildTabs();
  $('#lvEso').classList.toggle('on', LV === 'eso'); $('#lvBach').classList.toggle('on', LV === 'bach');
  let t = 0, s = 0;
  V.forEach((tb, i) => tb.sc.forEach((x, j) => { if (x.id === curId) { t = i; s = j; } }));
  go(t, s);
}
$('#lvEso').onclick = () => setLevel('eso');
$('#lvBach').onclick = () => setLevel('bach');
buildV(); buildTabs();
fit();
addEventListener('resize', fit);
go(0, 0);
requestAnimationFrame(loop);

/* ===== Premio final: Andy gigante (todas las estrellas), tecla X y clave secreta ===== */
const ANDY_LINES = [
  'La leche!!',
  'Qué decía Sergio que nadie iba a llegar hasta aquí!!',
  'Y tú vas y lo sacas en cuatro ratos!!',
  'Mira que te diga',
  'No tenemos un duro para gastarlo en premios',
  'Y yo sólo soy un anfibio sin bolsillos ni cuenta bancaria',
  'Así que... el premio es...',
  'El premio es...',
  'Bueeeeeeeno, la verdad es que...',
  'Ay, bueno, el premio es un bonito y grande...',
  'Vaya!! se pierde la conexión!!',
  'Dale a la tecla x y podrás repetir este mensaje! Ciao!! Me quedo sin cobertura!!'
];
const andyCake = $('#cake');
const andyEl = $('#andy'), andyMsg = $('#amsg'), andySr = $('#asr'), andyHead = $('#abig'), andyRep = $('#arep'), andyCls = $('#aclose');
let andyOn = false, andyPlaying = false, andyStarted = false, andyRun = 0, andyBuf = '', andyPrev = null;
const andySleep = ms => new Promise(r => setTimeout(r, ms));
function andyOpen() {
  if (andyOn) return;
  if (!andyHead.firstChild) andyHead.innerHTML = $('.axo svg').outerHTML.replace(/axG/g, 'abG').replace(/axF/g, 'abF');
  andyPrev = document.activeElement;
  [...document.body.children].forEach(el => { if (el !== andyEl && el.tagName !== 'SCRIPT') el.inert = true; });
  document.documentElement.style.overflow = 'hidden';
  andyEl.hidden = false; andyOn = true;
  andyCls.focus({ preventScroll: true });
}
function andyClose() {
  andyRun++; andyPlaying = false;
  andyEl.hidden = true; andyOn = false;
  andyEl.classList.remove('typing');
  andyHead.classList.remove('talk', 'glitch', 'off', 'gone'); andyCake.classList.remove('show');
  [...document.body.children].forEach(el => { if (el !== andyEl) el.inert = false; });
  document.documentElement.style.overflow = '';
  if (andyPrev && andyPrev.focus) andyPrev.focus({ preventScroll: true });
}
async function andyPlay() {
  const id = ++andyRun, live = () => id === andyRun;
  andyPlaying = true; andyStarted = true;
  andyHead.classList.remove('glitch', 'off', 'talk', 'gone'); andyCake.classList.remove('show');
  andyRep.hidden = true; andyMsg.textContent = ''; andySr.textContent = '';
  await andySleep(500); if (!live()) return;
  for (let i = 0; i < ANDY_LINES.length; i++) {
    const ln = ANDY_LINES[i], last = i === ANDY_LINES.length - 1;
    if (i === 10) andyHead.classList.add('glitch');
    if (i === 11) andyHead.classList.remove('glitch');
    andyMsg.textContent = ''; andySr.textContent = ln;
    andyEl.classList.add('typing'); andyHead.classList.add('talk');
    for (let c = 1; c <= ln.length; c++) { andyMsg.textContent = ln.slice(0, c); await andySleep(36); if (!live()) return; }
    andyEl.classList.remove('typing'); andyHead.classList.remove('talk');
    if (last) break;
    await andySleep(Math.max(1500, ln.length * 40) + (ln.endsWith('...') ? 700 : 0)); if (!live()) return;
  }
  andyPlaying = false; andyRep.hidden = false;
  await andySleep(1400); if (!live()) return;
  andyHead.classList.add('glitch');
  await andySleep(1800); if (!live()) return;
  andyHead.classList.remove('glitch');
  // Andy se queda sin cobertura... ¡y llega la cobertura de chocolate!
  const fin = 'Cobertura de chocolate!! Tachaaaaaaan!!';
  andyMsg.textContent = ''; andySr.textContent = fin + ' Un bonito y grande bizcocho de chocolate y naranja, con trocitos de naranja confitada.';
  andyRep.hidden = true; andyEl.classList.add('typing'); andyHead.classList.add('talk');
  for (let c = 1; c <= fin.length; c++) { andyMsg.textContent = fin.slice(0, c); await andySleep(40); if (!live()) return; }
  andyEl.classList.remove('typing'); andyHead.classList.remove('talk');
  await andySleep(500); if (!live()) return;
  andyHead.classList.add('gone'); andyCake.classList.add('show');
  andyRep.hidden = false;
}
function andyShow() {
  if (andyPlaying) return;
  andyOpen(); andyPlay();
}
andyCls.onclick = andyClose;
andyRep.onclick = andyShow;
addEventListener('keydown', e => {
  if (e.ctrlKey || e.metaKey || e.altKey) return;
  if (e.key === 'Escape' && andyOn) { andyClose(); return; }
  const t = e.target;
  if (t && (t.isContentEditable || t.tagName === 'TEXTAREA' || t.tagName === 'SELECT' || (t.tagName === 'INPUT' && /^(text|search|email|url|tel|password|number)$/i.test(t.type)))) return;
  if (!e.key || e.key.length !== 1) return;
  const k = e.key.toLowerCase();
  andyBuf = (andyBuf + k).slice(-10);
  if (andyBuf === 'ipekakuana') { andyBuf = ''; andyShow(); return; }
  if (k === 'x' && andyStarted && !andyPlaying) andyShow();
});
</script>
