 const lv=[0,...t.e.map(x=>a+=x),s.H],v=mode=='p'?6:st,u=mode=='p'&&!rev?pu:-1,mn=Math.min(...lv),mx=Math.max(...lv),
 Y=e=>372-(e-mn)/(mx-mn)*255,X=j=>62+96*j,pc=i=>mode!='p'&&i==v?'pop':'',
 hd=(x,y1,y2,w,z)=>{const d=y2<y1?9:-9;return`<line x1="${x}" x2="${x}" y1="${y1}" y2="${y2+d*.7}" stroke="currentColor" stroke-width="${w}"${z?' stroke-dasharray="6 4"':''} /><polygon points="${x},${y2} ${x-6},${y2+d} ${x+6},${y2+d}" fill="currentColor" />`},
 cp=(x,i)=>{const[n1,l2]=NL[i-1],[pf,l3]=i<5?cof(i-1,s):['',''],l1=(pf?pf+' ':'')+n1,xx=i==6?594:x;return`<text x="${x}" y="26" text-anchor="middle" font-size="19" class="e">${IC[i]}</text><text x="${xx}" y="42" text-anchor="middle" font-size="12" font-weight="700" class="c">${l1}</text><text x="${xx}" y="56" text-anchor="middle" font-size="12" font-weight="700" class="c">${l2}</text>${l3?`<text x="${xx}" y="70" text-anchor="middle" font-size="11" font-style="italic" class="c">${l3}</text>`:''}`};
 let o=`<line x1="110" x2="614" y1="${Y(0)}" y2="${Y(0)}" class="bl" />`;
 for(let j=0;j<=Math.min(v,5);j++){const y=Y(lv[j]);o+=`<g class="${pc(j)}" style="color:${j?CL[j-1]:'var(--mu)'}"><line x1="${X(j)-45}" x2="${X(j)+45}" y1="${y}" y2="${y}" stroke="currentColor" stroke-width="4" stroke-linecap="round" /><text x="${X(j)}" y="${j%2?y+19:y-9}" text-anchor="middle" font-size="${j==5?13:11.5}"${j==5?' class="t"':''}>${sp(j)}</text></g>`}
 for(let i=1;i<=Math.min(v,5);i++){const x=110+96*(i-1),y1=Y(lv[i-1]),y2=Y(lv[i]);o+=`<g class="${pc(i)}" style="color:${CL[i-1]}">${hd(x,y1,y2,3.5,u==i-1)}${cp(x,i)}<text x="${x+7}" y="${(y1+y2)/2+4}" font-size="12" font-weight="700" class="t">${u==i-1?'?':U(P[i-1])}</text></g>`}
 if(v>5){const y1=Y(0),y2=Y(s.H);o+=`<line x1="${X(5)+45}" x2="614" y1="${y2}" y2="${y2}" class="bl" /><g class="${pc(6)}" style="color:${CL[5]}">${hd(614,y1,y2,5,u==5)}${cp(614,6)}<text x="606" y="${(y1+y2)/2+4}" text-anchor="end" font-size="12" font-weight="700" class="t">${u==5?'?':U(s.H)}</text></g>`}
 dg.innerHTML=o+`<text x="320" y="410" text-anchor="middle" font-size="14">Altura de cada flecha ∝ energía · <tspan font-weight="800" text-decoration="underline">↑ se absorbe energía</tspan> · <tspan font-weight="800" text-decoration="underline">↓ se libera energía</tspan> · kJ/mol</text>`}
function eqn(s,t,i){
 const c=t.c,P=[...t.e,t.U],cur=i-1,
 hl=(j,h)=>{const col=CL[j];return j==cur?`<span class="hi" style="background:${col}33;color:${col};box-shadow:0 0 0 2px ${col}">${h}</span>`:j<cur?`<span style="color:${col}">${h}</span>`:`<span style="opacity:.28">${h}</span>`},
 sy=SY.map((x,j)=>hl(j,(j<4&&c[j]!=1?co(c[j]):'')+x)).join(' + ')+' = '+hl(5,'ΔH<sub>f</sub>'),
 nr=[];
 for(let j=0;j<=Math.min(cur,4);j++)nr.push(hl(j,(j<4&&c[j]!=1?co(c[j])+' mol × ':'')+fu(j<4?t.v[j]:t.U)));
 let n=nr.join(' + ');if(cur>=0&&cur<4)n+=' <span style="opacity:.3">+ …</span>';if(cur==5)n+=' = '+hl(5,U(s.H));
 return`<div class="eqb"><div>${sy}</div>${i?`<div class="nr">${n}</div>`:''}</div>`}
function infoS(){
 const s=D[ci],t=T(s),P=[...t.e,t.U],i=st,j=i-1,c=s.b/2,e=sum(s.e),
 TX=[`Los átomos escapan de la red metálica y pasan a gas: ${AB(1)} (endotérmico).`,
 `Arrancamos ${s.a*s.n} e⁻ por unidad de fórmula (${s.i.map((x,k)=>`${k+1}.ª: ${U(x)}`).join(', ')} por mol de átomos). Suele ser el escalón más alto: ${AB(1)}.`,
 `Rompemos el enlace ${s.X}–${s.X} de ${co(c)||1} mol de ${s.X}₂ para tener ${s.b} mol de átomos de ${s.X}. ${c==.5?`Como la estequiometría es 1:1, solo se usa <b>la mitad</b> de la energía de disociación del ${s.X}₂ (½ mol de ${s.X}₂ da 1 mol de átomos de ${s.X}). `:''}${AB(1)}.`,
 `Cada átomo de ${s.X} capta ${s.m} e⁻ y se convierte en ${s.Xi}. ${s.e.length>1?`La 1.ª afinidad (${U(s.e[0])}) libera energía, pero la 2.ª (${U(s.e[1])}) es positiva: meter un e⁻ en un anión cuesta energía. En total ${AB(e)}.`:`${AB(e)}.`}`,
 `¡El gran momento! Los iones gaseosos se atraen y se ordenan en la red cristalina: ${AB(-1)} y esa energía estabiliza el sólido iónico.`],eq=eqn(s,t,i);
 return(i==0?`<h3>🧱 Elementos nativos</h3><p class="eq">${sp(0)}</p>${eq}<p>Punto de partida: elementos en su estado estándar (entalpía de formación = 0 kJ/mol por convenio). Vamos a construir <b>${s.F}</b> escalón a escalón: ¡pulsa «Siguiente»!</p>`:i<6?`<h3>${IC[i]} ${j==2?dn(s):NM[j]}</h3><p class="eq">${sp(j)} → ${sp(i)}</p><div class="big" style="color:${CL[j]}">${NM[j]} = ${j<4&&t.c[j]!=1?co(t.c[j])+' mol × '+fu(t.v[j])+' = ':''}${U(P[j])}</div>${eq}<p>${TX[j]}</p><p class="mu">Energía acumulada: ${U(sum(P.slice(0,i)))}</p>`:`<h3>🏆 Esquema completo · ${s.F}</h3>${eq}<div class="big">${P.map((x,k)=>`<span style="color:${CL[k]}">${fu(x)}</span>`).join(' + ')} = <span style="color:${CL[5]}">${U(s.H)}</span></div><p>Cada término ya incluye su estequiometría. Como la entalpía de formación es negativa, formar ${s.F} desde sus elementos ${AB(-1)}: la red cristalina compensa con creces el coste de crear iones gaseosos.</p>`)+`<div class="mv">${MV[i]}</div>`}
function solH(){
 const s=D[ci],t=T(s),P=[...t.e,t.U],k=pu<4?t.c[pu]:1,kx=k==1?'x':co(k)+' mol × x',o=sum(P.filter((_,j)=>j!=pu)),H=U(s.H);
 return pu==5?`ΔHf = ${P.map(fu).join(' + ')} = <b>${H}</b>`:`${H} = ${P.map((x,j)=>j==pu?kx:fu(x)).join(' + ')}<br>${kx} = ${H} − (${U(o)}) = ${U(s.H-o)}${k==1?'':` → x = ${U(s.H-o)} ÷ ${co(k)} mol`} ⇒ <b>x = ${U(pu<4?t.v[pu]:t.U)}</b>`}
function infoP(){
 const s=D[ci],t=T(s),X2=s.X+'₂',
 L=[`la energía de sublimación del ${s.M}`,`la energía de ionización total del ${s.M} (${s.i.length>1?'suma de sus '+s.i.length+' ionizaciones':'su ionización'})`,`la energía de disociación del ${X2}`,`la afinidad electrónica total del ${s.X}${s.e.length>1?' (1.ª + 2.ª)':''}`,`la energía reticular del ${s.F}`,`la entalpía de formación del ${s.F}`],
 d=[[[`Energía de sublimación del ${s.M}`,s.s]],s.i.map((v,k)=>[`${k+1}.ª energía de ionización del ${s.M}`,v]),[[`Energía de disociación del ${X2}`,s.d]],s.e.map((v,k)=>[`${k+1}.ª afinidad del ${s.X}`,v]),[['Energía reticular',t.U]],[[`Entalpía de formación del ${s.F}`,s.H]]];
 return`<h3>🧮 Problema de ${s.F} <small class="mu">⭐ aciertos: ${sc}</small></h3><p>Para formar <b>1 mol de ${s.F}</b> se parte de ${co(s.a)||1} mol de ${s.M}(s) y ${co(s.b/2)||1} mol de ${X2}(g). Calcula <b>${L[pu]}</b>. <span class="mu">(Datos por mol de cada especie.)</span></p><div class="dat">${d.flatMap((a,j)=>j==pu?[]:a.map(([l,v])=>`<div class="dc"><span>${l}</span><b>${U(v)}</b></div>`)).join('')}</div><div class="row" style="justify-content:flex-start;padding:4px 0"><select id="un">${NS.map((l,j)=>`<option value="${j}"${j==pu?' selected':''}>${l}</option>`).join('')}</select><input id="ans" type="number" step="any" placeholder="tu resultado (kJ/mol)"><button class="b" data-a="chk">✅ Comprobar</button><button class="b" data-a="sol">👁 Solución</button><button class="b" data-a="rnd">🎲 Otro</button></div><div id="fb">${fbh}</div>`}
function chk(){
 const s=D[ci],t=T(s),v=parseFloat($('#ans').value),r=pu<4?t.v[pu]:pu==4?t.U:s.H,k=pu<4?t.c[pu]:1,m=h=>{fbh=h;$('#fb').innerHTML=h};
 if(isNaN(v))return m('<span class="mu">Escribe tu resultado en kJ/mol 🙂</span>');
 if(Math.abs(v-r)<=Math.max(2,Math.abs(r)*.004)){sc++;rev=1;fbh=`<div class="ok">🎉 ¡Correcto! ${NS[pu]} = ${U(r)}</div><div class="mu">${solH()}</div>`;boom();ui()}
 else m(`<span class="er">${Math.abs(v+r)<2?'Casi: revisa el <b>signo</b> (¿se absorbe o se libera energía?).':k!=1&&(Math.abs(v-r*k)<2||Math.abs(v*k-r)<2)?'Ojo con la <b>estequiometría</b>: cada paso se multiplica por sus moles.':'Aún no 💪 Recuerda ΔHf = ΔHsub + EI + ΔHdis + AE + Ur, con cada término × sus moles. ¡Otro intento!'}</span>`)}
function ui(){
 const v=mode=='p'?6:st;
 if(v!=stage){stage=v;if(v>0){const s=D[ci],P=[...T(s).e,T(s).U,s.H],c=CL[v-1];
  if(P[v-1]>0)[300,370,440].forEach(r=>fx.push({r,R:440,v:-3.2,c}));else fx.push({r:8,a:1,v:3,c},{r:8,a:.8,v:2,c});
  if(v==5)fx.push({r:8,a:1,v:5,c:'#14b86a'},{r:8,a:1,v:8,c:'#fff'});if(v==6)boom()}}
 $('#sl').innerHTML=D.map((s,i)=>`<button class="chip${i==ci?' on':''}" data-a="s" data-i="${i}">${s.F}<small>${co(s.a)}${s.Mi} + ${co(s.b)}${s.Xi}</small></button>`).join('');
 $('#m0').className='b'+(mode=='s'?' on':'');$('#m1').className='b'+(mode=='p'?' on':'');
 $('#sp').style.display=mode=='s'?'':'none';
 document.querySelectorAll('#sp [data-i]').forEach(b=>b.classList.toggle('on',+b.dataset.i==st));
 $('#pl').textContent=play?'⏸ Pausa':'▶ Auto';
 drawD();$('#in').innerHTML=mode=='s'?infoS():infoP()}
function auto(){clearInterval(tm);play=!play;if(play){if(st>=6)st=0;tm=setInterval(()=>{if(st<6){st++;ui()}else{play=0;clearInterval(tm);ui()}},3800)}ui()}
document.onclick=e=>{const b=e.target.closest('button');if(!b)return;const a=b.dataset.a,i=+b.dataset.i;
 if(a=='s'){ci=i;rev=0;fbh='';build();ui()}
 else if(a=='g'){st=i;ui()}
 else if(a=='nx'){st=Math.min(6,st+1);ui()}
 else if(a=='pv'){st=Math.max(0,st-1);ui()}
 else if(a=='pl')auto();
 else if(a=='fin'){st=6;ui();dg.scrollIntoView({behavior:'smooth',block:'center'})}
 else if(a=='m'){mode=b.dataset.v;if(mode=='p'){play=0;clearInterval(tm)}ui()}
 else if(a=='chk')chk();
 else if(a=='sol'){rev=1;fbh=`<div class="ok">${solH()}</div>`;ui()}
 else if(a=='rnd'){ci=R()*D.length|0;pu=R()*6|0;rev=0;fbh='';build();ui()}};
document.onchange=e=>{if(e.target.id=='un'){pu=+e.target.value;rev=0;fbh='';ui()}};
document.onkeydown=e=>{if(e.key=='Enter'&&e.target.id=='ans')chk()};
$('#sp').innerHTML=IC.map((x,i)=>`<button class="b" data-a="g" data-i="${i}" title="${i?i<6?NM[i-1]:'Resultado':'Inicio'}">${x}</button>`).join('')+'<button class="b" data-a="pv">◀</button><button class="b" data-a="nx">Siguiente ▶</button><button class="b" data-a="pl" id="pl">▶ Auto</button><button class="b" data-a="fin">📊 Esquema final</button>';
build();ui();requestAnimationFrame(fr);
</script></body></html>
